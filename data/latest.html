<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#3a6dd6" />
<title>NewsPulse 每日资讯</title>
<style>
  :root{
    /* 间距尺度（4px 基） */
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px;
    --bg:#f3f5f8; --card:#ffffff; --ink:#171a20; --sub:#6a7280; --sub-2:#9aa3b0;
    --line:#e7ebf1; --primary:#3a6dd6; --primary-soft:#eaf1fc; --primary-press:#dde8fa;
    --red:#d9534f; --safe:env(safe-area-inset-bottom);
    --shadow:0 1px 3px rgba(18,28,48,.06), 0 6px 18px rgba(18,28,48,.04);
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;
    padding-bottom:calc(74px + var(--safe)); /* 给底部导航留位 */
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto;padding:0 var(--s4)}

  /* —— 顶部细栏 —— */
  header.top{
    position:sticky;top:0;z-index:20;background:rgba(243,245,248,.86);
    backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);
    border-bottom:1px solid var(--line);
    padding-top:calc(env(safe-area-inset-top) + 2px);
  }
  .topbar-inner{display:flex;align-items:center;justify-content:space-between;height:52px;gap:var(--s3)}
  .brand{display:flex;align-items:center;gap:var(--s2);min-width:0}
  .brand-mark{width:22px;height:22px;border-radius:7px;background:var(--primary);flex:none;
    position:relative;box-shadow:0 2px 6px rgba(58,109,214,.35)}
  .brand-mark::after{content:"";position:absolute;inset:6px 6px auto auto;width:6px;height:6px;border-radius:2px;background:#fff;opacity:.92}
  .brand-name{font-size:17px;font-weight:800;letter-spacing:.2px;white-space:nowrap}
  .top-actions{display:flex;align-items:center;gap:var(--s2)}
  .datepill{
    display:flex;align-items:center;gap:6px;height:36px;padding:0 12px;border:1px solid var(--line);
    border-radius:999px;background:var(--card);color:var(--ink);font-size:13.5px;font-weight:600;cursor:pointer;
  }
  .datepill:active{background:var(--primary-soft)}
  .datepill .cal{width:15px;height:15px;color:var(--primary);flex:none}
  .iconbtn{
    width:36px;height:36px;border:1px solid var(--line);border-radius:10px;background:var(--card);
    display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;color:var(--primary);
  }
  .iconbtn:active{background:var(--primary-soft)}

  /* 搜索条（仅在“搜索”标签激活时展开） */
  .searchbar{display:none;padding:0 0 var(--s2);overflow:hidden}
  .searchbar.show{display:block;animation:drop .22s cubic-bezier(.2,.7,.2,1)}
  .search{
    width:100%;height:44px;border:1px solid var(--line);border-radius:12px;
    padding:0 14px;font-size:16px;background:var(--card);color:var(--ink);outline:none;
  }
  .search:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}

  /* —— 列表 —— */
  .list{margin:var(--s4) 0 var(--s2)}
  .dayhead{display:flex;align-items:baseline;gap:var(--s2);margin:var(--s4) 2px var(--s2)}
  .dayhead .d{font-size:15px;font-weight:700;color:var(--ink)}
  .dayhead .m{font-size:12.5px;color:var(--sub)}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:var(--s4);margin:var(--s3) 0;box-shadow:var(--shadow);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .card:active{transform:translateY(1px);box-shadow:0 1px 2px rgba(18,28,48,.08)}
  .card .badges{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap;margin-bottom:var(--s2)}
  .badge{font-size:12px;padding:3px 9px;border-radius:999px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
  .src{font-size:12px;color:var(--sub)}
  .score{font-size:12px;color:var(--sub);margin-left:auto;font-variant-numeric:tabular-nums}
  .card h2{font-size:17px;margin:2px 0 var(--s2);font-weight:700;line-height:1.42;letter-spacing:-.01em}
  .card h2 a{color:var(--ink);text-decoration:none}
  .card h2 a:active{color:var(--primary)}
  ul.pts{margin:var(--s2) 0 0;padding-left:18px;color:#3a4150;font-size:14.5px;line-height:1.6}
  ul.pts li{margin:4px 0}
  .summary{margin-top:var(--s2);font-size:14.5px;color:#3a4150;line-height:1.62}
  .take{
    margin-top:var(--s3);font-size:13.5px;color:#2b59b8;background:var(--primary-soft);
    padding:var(--s2) 12px;border-radius:10px;display:flex;gap:7px;align-items:flex-start;line-height:1.55;
  }
  .take svg{width:16px;height:16px;flex:none;margin-top:1px;color:var(--primary)}
  .empty{text-align:center;color:var(--sub);padding:64px var(--s5)}
  .empty .big{font-size:17px;font-weight:700;color:var(--ink);margin-bottom:var(--s2)}
  .empty code{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:13px}
  footer{text-align:center;color:var(--sub-2);font-size:12px;padding:var(--s4) 0 calc(var(--s4) + 4px)}

  /* —— 底部导航 —— */
  nav.tabbar{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:rgba(255,255,255,.94);backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);
    border-top:1px solid var(--line);
    padding-bottom:var(--safe);
    display:flex;
  }
  .tab{
    flex:1;min-width:0;background:none;border:none;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    height:56px;color:var(--sub);padding:6px 2px 0;
  }
  .tab svg{width:23px;height:23px}
  .tab .lab{font-size:11px;font-weight:600;line-height:1}
  .tab.on{color:var(--primary)}
  .tab.on svg{stroke-width:2.2}
  .tab:active{background:var(--primary-soft)}

  /* —— 底部抽屉（日期 / 领域） —— */
  .sheet-mask{position:fixed;inset:0;background:rgba(15,23,42,.42);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
  .sheet-mask.show{opacity:1;pointer-events:auto}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);
    border-radius:18px 18px 0 0;padding:var(--s4) var(--s4) calc(var(--s5) + var(--safe));
    transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);max-height:82vh;overflow:auto;
  }
  .sheet.show{transform:translateY(0)}
  .sheet h3{margin:0 0 var(--s2);font-size:17px;font-weight:800}
  .sheet .sub{color:var(--sub);font-size:13px;margin:0 0 var(--s3)}
  .grab{width:38px;height:4px;border-radius:999px;background:var(--line);margin:0 auto var(--s3)}
  .quick{display:flex;gap:var(--s2);flex-wrap:wrap;margin-bottom:var(--s3)}
  .qbtn{padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--bg);
    font-size:14px;font-weight:600;color:var(--ink);cursor:pointer}
  .qbtn:active{background:var(--primary-soft)}
  .qbtn.on{background:var(--primary);color:#fff;border-color:var(--primary)}
  .dateinput{
    width:100%;height:46px;border:1px solid var(--line);border-radius:12px;padding:0 12px;
    font-size:16px;color:var(--ink);background:var(--card);outline:none;
  }
  .dateinput:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
  .primary-btn{
    margin-top:var(--s3);width:100%;height:48px;border:none;border-radius:12px;background:var(--primary);
    color:#fff;font-size:15.5px;font-weight:700;cursor:pointer;
  }
  .primary-btn:active{filter:brightness(.95)}
  /* 领域列表 */
  .catrow{
    display:flex;align-items:center;gap:var(--s3);padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer;
  }
  .catrow:last-child{border-bottom:none}
  .catrow .dotc{width:10px;height:10px;border-radius:50%;flex:none}
  .catrow .nm{font-size:15.5px;font-weight:600;flex:1}
  .catrow .cnt{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
  .catrow .tick{width:20px;height:20px;color:var(--primary);opacity:0;flex:none}
  .catrow.on .tick{opacity:1}
  .catrow.on .nm{color:var(--primary)}

  /* 设置抽屉 */
  .drawer-mask{position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:40;display:none}
  .drawer{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);
    border-radius:18px 18px 0 0;padding:var(--s4) var(--s4) calc(var(--s5) + var(--safe));display:none;max-height:80vh;overflow:auto}
  .drawer h3{margin:0 0 var(--s3);font-size:17px}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:12px 2px;border-bottom:1px solid var(--line)}
  .toggle-row .name{font-size:15px}
  .sw{width:48px;height:28px;border-radius:999px;background:var(--line);position:relative;transition:.2s;flex:none}
  .sw.on{background:var(--primary)}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
  .sw.on::after{left:23px}
  .drawer .hint{color:var(--sub);font-size:13px;margin-top:var(--s3);line-height:1.6}

  @keyframes drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  /* 桌面端：底部导航收束为居中浮条，内容更宽留白 */
  @media (min-width:860px){
    .wrap{max-width:820px}
    nav.tabbar{left:50%;transform:translateX(-50%);right:auto;bottom:calc(18px + var(--safe));
      width:min(520px,92vw);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
    body{padding-bottom:96px}
  }
</style>
</head>

const PALETTE = ["#3a6dd6","#1f9d8b","#c47a2c","#7a54c8","#c44f86","#4f8a36","#c79125"];
const catColor = {};
function colorFor(id, i){ if(!(id in catColor)) catColor[id]=PALETTE[i%PALETTE.length]; return catColor[id]; }

let DATA = null;
let EMBEDDED = DIGEST;          // 内联的“今天”数据
let viewedDate = DIGEST ? DIGEST.date : null;
let hidden = loadHidden();
let activeCat = "all";
let query = "";
let availDates = [];            // 归档可用日期（来自 archive/index.json）

function loadHidden(){
  try{ return JSON.parse(localStorage.getItem("np_hidden")||"{}"); }catch(e){ return {}; }
}
function saveHidden(){ localStorage.setItem("np_hidden", JSON.stringify(hidden)); }
function esc(s){ return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function shiftDate(n){ const d=new Date(); d.setDate(d.getDate()-n); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function fmtDate(s){
  const d=new Date(s+"T00:00:00"); if(isNaN(d)) return s;
  const wd=["周日","周一","周二","周三","周四","周五","周六"][d.getDay()];
  return `${d.getMonth()+1}月${d.getDate()}日 ${wd}`;
}
function isToday(s){ return s===todayStr() || (EMBEDDED && s===EMBEDDED.date); }

/* —— 渲染 —— */
function render(){
  if(!DATA){ document.getElementById("emptyTitle").textContent="无数据";
    document.getElementById("emptyMsg").textContent="请先运行生成，或访问最新 data/latest.html。";
    document.getElementById("empty").hidden=false; document.getElementById("list").innerHTML=""; return; }
  const cats = DATA.categories||[];
  // 顶部日期标签
  document.getElementById("dateLabel").textContent = isToday(DATA.date) ? "今天" : fmtDate(DATA.date);
  // 日头部
  let head = `<div class="dayhead"><span class="d">${esc(isToday(DATA.date)?"今日资讯":fmtDate(DATA.date))}</span>`+
             `<span class="m">共 ${DATA.total} 条 · 覆盖 ${cats.length} 个领域${DATA.items[0]&&DATA.items[0].ai?" · AI 摘要":""}</span></div>`;
  // 列表过滤
  let items=(DATA.items||[]).filter(it=>!hidden[it.category]);
  if(activeCat!=="all") items=items.filter(it=>it.category===activeCat);
  if(query){ const q=query.toLowerCase();
    items=items.filter(it=>(it.title+" "+(it.takeaway||"")+" "+(it.source||"")+" "+(it.summary||"")).toLowerCase().includes(q)); }
  const list=document.getElementById("list");
  document.getElementById("empty").hidden = !(items.length===0);
  if(items.length===0){
    document.getElementById("emptyTitle").textContent = query? "没有匹配结果" : "该日暂无内容";
    document.getElementById("emptyMsg").textContent = query? "换个关键词试试。" : "这一天的归档里没有符合条件的条目。";
    list.innerHTML = head; return;
  }
  let html = head;
  items.forEach((it)=>{
    const ci = cats.findIndex(c=>c.id===it.category);
    const col=colorFor(it.category, ci<0?0:ci);
    const pts=(it.points||[]).map(p=>`<li>${esc(p)}</li>`).join("");
    const body = pts ? `<ul class="pts">${pts}</ul>`
                     : (it.summary?`<div class="summary">${esc(it.summary)}</div>`:"");
    const take = it.takeaway ? `<div class="take"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.2 1 2V18h6v-1.3c0-.8.4-1.5 1-2A7 7 0 0 0 12 2Z"/></svg><span>${esc(it.takeaway)}</span></div>` : "";
    html += `<div class="card">
      <div class="badges">
        <span class="badge" style="background:${col}1f;color:${col}">${esc(it.category_name)}</span>
        <span class="src">${esc(it.source||"")}</span>
        <span class="score">质量 ${it.score??""}</span>
      </div>
      <h2><a href="${esc(it.link)}" target="_blank" rel="noopener">${esc(it.title)}</a></h2>
      ${body}
      ${take}
    </div>`;
  });
  list.innerHTML = html;
  // 仅在“切换日期/新数据”时播放一次入场动画，筛选/搜索重渲不再重播（避免散落动效）
  if(DATA !== _lastRenderedData){
    _lastRenderedData = DATA;
    list.querySelectorAll(".card").forEach((c,i)=>{ c.style.animation=`cardin .3s cubic-bezier(.2,.7,.2,1) ${Math.min(i*18,260)}ms both`; });
  }
}
let _lastRenderedData = null;

/* 卡片入场动画（仅整批加载时播放一次） */
const styleCard=document.createElement("style");
styleCard.textContent="@keyframes cardin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}";
document.head.appendChild(styleCard);

function renderToggles(){
  const box=document.getElementById("toggles"); box.innerHTML="";
  (DATA?.categories||EMBEDDED?.categories||[]).forEach(c=>{
    const row=document.createElement("div"); row.className="toggle-row";
    row.innerHTML=`<div class="name">${esc(c.name)}</div>`;
    const sw=document.createElement("div"); sw.className="sw"+(!hidden[c.id]?" on":"");
    sw.onclick=()=>{ hidden[c.id]=!hidden[c.id]; saveHidden(); sw.className="sw"+(!hidden[c.id]?" on":""); render(); };
    row.appendChild(sw); box.appendChild(row);
  });
}

/* —— 加载某日（今天用内联，往日抓 archive） —— */
async function loadDate(dateStr){
  viewedDate = dateStr;
  if(EMBEDDED && dateStr===EMBEDDED.date){ DATA=EMBEDDED; render(); return; }
  try{
    const r=await fetch(`archive/${dateStr}.json`,{cache:"no-store"});
    if(r.ok){ DATA=await r.json(); render(); return; }
  }catch(e){}
  DATA={date:dateStr,total:0,categories:[],items:[]}; render();
}

/* —— 领域抽屉 —— */
function openCatSheet(){
  const list=document.getElementById("catList"); list.innerHTML="";
  const cats=(DATA||EMBEDDED||{}).categories||[];
  const mk=(name,key,col,cnt)=>{
    const row=document.createElement("div"); row.className="catrow"+(activeCat===key?" on":"");
    row.innerHTML=`<span class="dotc" style="background:${col}"></span><span class="nm">${esc(name)}</span>`+
      (cnt!=null?`<span class="cnt">${cnt}</span>`:"")+
      `<svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>`;
    row.onclick=()=>{ activeCat=key; closeSheet("cat"); render(); };
    list.appendChild(row);
  };
  mk("全部","all","#9aa3b0",null);
  cats.forEach((c,i)=>mk(c.name,c.id,colorFor(c.id,i),c.count));
  openSheet("cat");
}

/* —— 抽屉通用 —— */
function openSheet(which){
  document.getElementById(which+"Mask").classList.add("show");
  document.getElementById(which+"Sheet").classList.add("show");
}
function closeSheet(which){
  document.getElementById(which+"Mask").classList.remove("show");
  document.getElementById(which+"Sheet").classList.remove("show");
}

/* —— 底部标签 —— */
function setTab(tab){
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on", t.dataset.tab===tab));
  const sb=document.getElementById("searchbar");
  if(tab==="search"){ sb.classList.add("show"); setTimeout(()=>document.getElementById("search").focus(),60); }
  else { sb.classList.remove("show"); if(tab!=="search"){ /* 保留 query，仅收起框 */ } }
  if(tab==="cat") openCatSheet();
  if(tab==="settings"){ document.getElementById("mask").style.display="block"; document.getElementById("drawer").style.display="block"; }
}
document.getElementById("tabbar").addEventListener("click",e=>{
  const b=e.target.closest(".tab"); if(!b) return; setTab(b.dataset.tab);
});

/* —— 日期抽屉 —— */
function openDateSheet(){
  const inp=document.getElementById("dateInput");
  inp.max = EMBEDDED? EMBEDDED.date : todayStr();
  inp.min = availDates.length? availDates[0] : shiftDate(30);
  inp.value = viewedDate || (EMBEDDED?EMBEDDED.date:todayStr());
  // 快捷按钮高亮
  document.querySelectorAll("#dateQuick .qbtn").forEach(b=>{
    const d=b.dataset.d; const val=d==="today"?todayStr():(d==="yesterday"?shiftDate(1):"");
    b.classList.toggle("on", val && val===inp.value);
  });
  openSheet("date");
}
document.getElementById("datePill").onclick=openDateSheet;
document.getElementById("dateQuick").addEventListener("click",e=>{
  const b=e.target.closest(".qbtn"); if(!b) return;
  const d=b.dataset.d; const val=d==="today"?todayStr():(d==="yesterday"?shiftDate(1):"");
  if(val){ document.getElementById("dateInput").value=val;
    document.querySelectorAll("#dateQuick .qbtn").forEach(x=>x.classList.toggle("on",x===b)); }
});
document.getElementById("dateGo").onclick=()=>{
  const v=document.getElementById("dateInput").value; if(!v) return;
  closeSheet("date"); loadDate(v);
};
["dateMask","catMask"].forEach(id=>document.getElementById(id).onclick=()=>{
  const which=id.replace("Mask",""); closeSheet(which);
});
document.getElementById("mask").onclick=()=>{
  document.getElementById("mask").style.display="none"; document.getElementById("drawer").style.display="none";
};

/* —— 搜索 / 刷新 —— */
document.getElementById("search").addEventListener("input",e=>{query=e.target.value;render();});
document.getElementById("refreshBtn").onclick=()=>{
  if(EMBEDDED && viewedDate===EMBEDDED.date){ location.reload(); }
  else { loadDate(EMBEDDED?EMBEDDED.date:viewedDate); }
};

/* —— 启动 —— */
async function boot(){
  if(DIGEST){ DATA=DIGEST; render(); renderToggles(); }
  // 拉取可用归档日期（用于日期输入范围与回看）
  try{
    const r=await fetch("archive/index.json",{cache:"no-store"});
    if(r.ok){ availDates=await r.json(); }
  }catch(e){}
  if(!DIGEST){
    try{
      const r=await fetch("../data/latest.json",{cache:"no-store"});
      if(r.ok){ EMBEDDED=DATA=await r.json(); render(); renderToggles(); return; }
    }catch(e){}
    document.getElementById("emptyTitle").textContent="无数据";
    document.getElementById("emptyMsg").textContent="请先运行生成，或访问最新 data/latest.html。";
    document.getElementById("empty").hidden=false;
  }
}
boot();
</script>
