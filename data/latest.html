<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<title>NewsPulse 每日资讯</title>
<style>
  :root{
    /* 间距尺度（4px 基） */
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px;
    --bg:#f3f5f8; --card:#ffffff; --ink:#171a20; --sub:#6a7280; --sub-2:#9aa3b0;
    --line:#e7ebf1; --primary:#3a6dd6; --primary-soft:#eaf1fc; --primary-press:#dde8fa;
    --red:#d9534f; --safe:env(safe-area-inset-bottom);
    --shadow:0 1px 3px rgba(18,28,48,.06), 0 6px 18px rgba(18,28,48,.04);
    --shadow-up:0 -1px 3px rgba(18,28,48,.06), 0 -8px 24px rgba(18,28,48,.05);
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;
    padding-bottom:calc(72px + var(--safe)); /* 给底部导航留位 */
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto;padding:0 var(--s4)}
  button{font-family:inherit}

  /* —— 顶部细栏 —— */
  header.top{
    position:sticky;top:0;z-index:20;background:rgba(243,245,248,.86);
    backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);
    border-bottom:1px solid var(--line);
    padding-top:calc(env(safe-area-inset-top) + 2px);
  }
  .topbar-inner{display:flex;align-items:center;justify-content:space-between;height:52px;gap:var(--s3)}
  .brand{display:flex;align-items:center;gap:var(--s2);min-width:0}
  .brand-mark{width:22px;height:22px;border-radius:7px;background:var(--primary);flex:none;
    position:relative;box-shadow:0 2px 6px rgba(58,109,214,.35)}
  .brand-mark::after{content:"";position:absolute;inset:6px 6px auto auto;width:6px;height:6px;border-radius:2px;background:#fff;opacity:.92}
  .brand-name{font-size:17px;font-weight:800;letter-spacing:.2px;white-space:nowrap}
  .top-actions{display:flex;align-items:center;gap:var(--s2)}
  .datepill{
    display:flex;align-items:center;gap:6px;height:36px;padding:0 12px;border:1px solid var(--line);
    border-radius:999px;background:var(--card);color:var(--ink);font-size:13.5px;font-weight:600;cursor:pointer;
  }
  .datepill:active{background:var(--primary-soft)}
  .datepill .cal{width:15px;height:15px;color:var(--primary);flex:none}
  .iconbtn{
    width:36px;height:36px;border:1px solid var(--line);border-radius:10px;background:var(--card);
    display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;color:var(--primary);
  }
  .iconbtn:active{background:var(--primary-soft)}

  /* —— 列表 —— */
  .list{margin:var(--s4) 0 var(--s2)}
  .dayhead{display:flex;align-items:baseline;gap:var(--s2);margin:var(--s4) 2px var(--s2)}
  .dayhead .d{font-size:15px;font-weight:700;color:var(--ink)}
  .dayhead .m{font-size:12.5px;color:var(--sub)}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:var(--s4);margin:var(--s3) 0;box-shadow:var(--shadow);cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .card:hover{border-color:#d6deea}
  .card:active{transform:translateY(1px);box-shadow:0 1px 2px rgba(18,28,48,.08)}
  .card:focus-visible{outline:2px solid var(--primary);outline-offset:1px}
  .card .badges{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap;margin-bottom:var(--s2)}
  .badge{font-size:12px;padding:3px 9px;border-radius:999px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
  .src{font-size:12px;color:var(--sub)}
  .score{font-size:12px;color:var(--sub);margin-left:auto;font-variant-numeric:tabular-nums}
  .card h2{font-size:17px;margin:2px 0 var(--s2);font-weight:700;line-height:1.42;letter-spacing:-.01em;color:var(--ink)}
  .card .row{display:flex;align-items:center;gap:var(--s2)}
  .extlink{
    width:26px;height:26px;flex:none;border-radius:8px;display:flex;align-items:center;justify-content:center;
    color:var(--sub);background:var(--bg);border:1px solid var(--line);
  }
  .extlink:active{background:var(--primary-soft);color:var(--primary)}
  ul.pts{margin:var(--s2) 0 0;padding-left:18px;color:#3a4150;font-size:14.5px;line-height:1.6}
  ul.pts li{margin:4px 0}
  .summary{margin-top:var(--s2);font-size:14.5px;color:#3a4150;line-height:1.62}
  .take{
    margin-top:var(--s3);font-size:13.5px;color:#2b59b8;background:var(--primary-soft);
    padding:var(--s2) 12px;border-radius:10px;display:flex;gap:7px;align-items:flex-start;line-height:1.55;
  }
  .take svg{width:16px;height:16px;flex:none;margin-top:1px;color:var(--primary)}
  .empty{text-align:center;color:var(--sub);padding:64px var(--s5)}
  .empty .big{font-size:17px;font-weight:700;color:var(--ink);margin-bottom:var(--s2)}
  .empty code{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:13px}
  footer{text-align:center;color:var(--sub-2);font-size:12px;padding:var(--s4) 0 calc(var(--s4) + 4px)}

  /* —— 详情页 —— */
  .detail{animation:pagein .26s cubic-bezier(.2,.7,.2,1)}
  .dback{
    display:inline-flex;align-items:center;gap:6px;margin:var(--s4) 0 var(--s3);padding:8px 14px;
    border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);
    font-size:14px;font-weight:600;cursor:pointer;
  }
  .dback:active{background:var(--primary-soft)}
  .dhead{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:var(--s5) var(--s4);box-shadow:var(--shadow)}
  .dhead .dmeta{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;margin-bottom:var(--s3);font-size:13px;color:var(--sub)}
  .dhead h1{font-size:21px;line-height:1.4;margin:0 0 var(--s3);font-weight:800;letter-spacing:-.01em}
  .dbody{
    margin-top:var(--s3);background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:var(--s4);box-shadow:var(--shadow);font-size:15.5px;line-height:1.78;color:#232833;
  }
  .dbody p{margin:0 0 12px}
  .dbody p:last-child{margin-bottom:0}
  .dbody .note{color:var(--sub);font-size:13.5px}
  .dhead .take{margin-top:0}
  .dpts{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:var(--s4) var(--s4) var(--s4) var(--s5);margin-top:var(--s3);box-shadow:var(--shadow)}
  .dpts h3{margin:0 0 var(--s2);font-size:15px;font-weight:800}
  .readmore{
    display:flex;align-items:center;justify-content:center;gap:8px;margin:var(--s4) 0 var(--s3);
    width:100%;height:48px;border:none;border-radius:12px;background:var(--primary);color:#fff;
    font-size:15.5px;font-weight:700;text-decoration:none;cursor:pointer;
  }
  .readmore:active{filter:brightness(.95)}

  /* —— 底部导航：单胶囊（当前分类切换器） —— */
  /* 借鉴 Material Bottom Navigation / iOS HIG：底栏单按钮 + 抽屉展开全部分类，
     避免多胶囊被压缩导致文字截断；抽屉采用标准 Modal Bottom Sheet。 */
  nav.navbar{
    position:fixed;left:0;right:0;bottom:0;z-index:35;
    background:rgba(255,255,255,.94);backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);
    border-top:1px solid var(--line);
    padding:8px 12px calc(8px + var(--safe));
  }
  .navbar-bar{display:flex;align-items:center;gap:8px}
  .navbtn{
    flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:999px;
    cursor:pointer;display:flex;align-items:center;gap:8px;height:42px;padding:0 14px;
    color:var(--ink);font-size:14px;font-weight:600;
    transition:background .15s,border-color .15s;
  }
  .navbtn:active{background:var(--primary-soft)}
  .navbtn .dotc{width:9px;height:9px;border-radius:50%;flex:none}
  .navbtn .lab{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
  .navbtn .chev{width:16px;height:16px;color:var(--sub);flex:none;transition:transform .22s cubic-bezier(.2,.8,.2,1)}
  .navbtn.open{border-color:var(--primary);color:var(--primary)}
  .navbtn.open .chev{transform:rotate(180deg);color:var(--primary)}

  /* —— 抽屉（标准 Modal Bottom Sheet：圆角顶部 + grab handle + 阴影 + 滑入） —— */
  /* 收起态默认不可点击，避免 hit-test 干扰背后内容 */
  .sheet-mask{position:fixed;inset:0;background:rgba(15,23,42,.42);z-index:40;opacity:0;pointer-events:none;transition:opacity .22s}
  .sheet-mask.show{opacity:1;pointer-events:auto}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);
    border-radius:18px 18px 0 0;
    padding:8px var(--s4) calc(var(--s5) + var(--safe));
    transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
    max-height:82vh;overflow:auto;box-shadow:var(--shadow-up);
    pointer-events:none;
  }
  .sheet.show{transform:translateY(0);pointer-events:auto}
  .grab{width:38px;height:4px;border-radius:999px;background:var(--line);margin:6px auto var(--s3);cursor:pointer}
  .sheet h3{margin:0 0 4px;font-size:17px;font-weight:800}
  .sheet .sub{color:var(--sub);font-size:13px;margin:0 0 var(--s3)}

  /* 分类抽屉：网格 */
  .cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s2);margin-top:var(--s1)}
  .cat-tile{
    display:flex;align-items:center;gap:10px;
    padding:13px 12px;border:1px solid var(--line);border-radius:12px;
    background:var(--bg);color:var(--ink);font-size:14.5px;font-weight:600;
    cursor:pointer;text-align:left;transition:background .15s,border-color .15s,color .15s;
    min-width:0;
  }
  .cat-tile:active{background:var(--primary-press)}
  .cat-tile.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
  .cat-tile .dotc{width:10px;height:10px;border-radius:50%;flex:none}
  .cat-tile .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cat-tile .cnt{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;flex:none}
  .cat-tile.on .cnt{color:var(--primary)}
  .cat-tile .chk{width:18px;height:18px;color:var(--primary);flex:none;opacity:0;transition:opacity .15s}
  .cat-tile.on .chk{opacity:1}

  /* —— 日期抽屉：快捷按钮 —— */
  .quick{display:flex;gap:var(--s2);flex-wrap:wrap;margin-bottom:var(--s3)}
  .qbtn{padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--bg);
    font-size:14px;font-weight:600;color:var(--ink);cursor:pointer}
  .qbtn:active{background:var(--primary-soft)}
  .qbtn.on{background:var(--primary);color:#fff;border-color:var(--primary)}
  .dateinput{
    width:100%;height:46px;border:1px solid var(--line);border-radius:12px;padding:0 12px;
    font-size:16px;color:var(--ink);background:var(--card);outline:none;
  }
  .dateinput:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
  .primary-btn{
    margin-top:var(--s3);width:100%;height:48px;border:none;border-radius:12px;background:var(--primary);
    color:#fff;font-size:15.5px;font-weight:700;cursor:pointer;
  }
  .primary-btn:active{filter:brightness(.95)}

  @keyframes cardin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes pagein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* 桌面端：底栏收束为居中浮条；分类抽屉居中浮出 */
  @media (min-width:860px){
    .wrap{max-width:820px}
    nav.navbar{left:50%;transform:translateX(-50%);right:auto;bottom:calc(18px + var(--safe));
      width:min(480px,92vw);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
    body{padding-bottom:120px}
    /* 桌面端抽屉浮起并居中，圆角四周 */
    .sheet{left:50%;right:auto;transform:translate(-50%,100%);width:min(420px,92vw);
      border-radius:18px;bottom:calc(18px + var(--safe) + 64px)}
    .sheet.show{transform:translate(-50%,0)}
    .cat-grid{grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>

该公司可能寻求融资超过1000亿美元，上市估值甚至可能达到2万亿美元。 从多方媒体来看，Anthropic的上市准备已经持续了一段时间。承销团队已经基本确定，摩根士丹利、高盛和摩根大通担任主要承销商，花旗等银行也可能加入。法律事务则由Wilson Sonsini负责，该律所曾参与谷歌2004年的IPO。 在正式公开提交招股书之前，Anthropic已经开始向潜在投资者进行推介，介绍该公司的业务状况、收入增长和未来规划，同时测试市场对公司股票的兴趣。 Anthropic还在准备一笔超过100亿美元的循环信贷额度，规模明显高于此前约25亿美元的水平。对于一家需要持续购买芯片、数据中心和能源资源的AI公司而言，这笔融资可以增加上市前的流动性，也为后续扩张留出空间。 目前市场预计，Anthropic可能在8月底前后公开提交S-1，并在未来几个月上市，最快可能在10月完成IPO。 相比之下，OpenAI虽然也在与投资者洽谈上市，但市场预期其IPO更可能在2027年。 Anthropic还为这次上市准备了足够大的增长故事。 2025年底，公司年化营收约90亿美元。到今年5月，这一数字已经超过470亿美元，7月底进一步达到约650亿美元。一名知情人士称，Anthropic第二季度营收达到115亿美元，同比暴增14倍。 收入增长主要来自Claude模型及其企业产品。Claude Code的突破让Anthropic在AI编程智能体市场迅速扩大，此后公司又推出Claude Cowork，并与微软365（Microsoft 365）等生产力软件套件进行集成。 今年5月，Anthropic完成650亿美元H轮融资，投后估值约9650亿美元。此前2月的G轮融资估值约3800亿美元。同期，OpenAI估值约8520亿美元。Anthropic由此成为全球估值最高的私人初创公司之一。 Anthropic内部预测显示，2028年营收可能达到1900亿至2000亿美元。部分投资者正是根据这一增长预期，判断公司上市估值可能接近甚至超过2万亿美元。 但高增长也带来了另一个问题：Anthropic需要多少算力，才能支撑这笔收入。 算力之外，Anthropic开始造芯片 Anthropic正在同时解决芯片和数据中心问题。 目前，Anthropic采用多芯片策略，同时使用亚马逊AWS Trainium、谷歌TPU以及英伟达GPU。与此同时，该公司不断签署新的算力容量协议，与英国芯片初创公司Fractile的首笔订单约为2.5亿美元，并与Riot、Volta Infra签署算力容量协议。 这种方式可以快速扩大算力池，但长期成本仍然很高。随着Claude需求持续增长，Anthropic需要更多服务器芯片、数据中心和能源，而AI基础设施本身已经成为模型公司最大的投入之一。 为此，Anthropic开始组建自己的芯片团队。 据美国科技媒体BI披露，Anthropic已经正式确认正在建立“定制硅芯片团队”，招聘芯片设计、验证等领域的工程师，并希望从架构设计一直做到流片、首次硅验证和生产准备。 一份Silicon Engineer招聘信息显示，该岗位薪资范围为32万至48.5万美元，并要求候选人具备直接参与半导体设计最终定型和量产交付的经验。 美国当地时间8月21日，Anthropic还被曝挖来谷歌“TPU之父”阿米尔·萨莱克（Amir Salek）加入计算团队，直接向算力基础设施与硬件/系统团队主管詹姆斯·布拉德伯里（James Bradbury）汇报。 萨莱克曾长期负责谷歌定制芯片业务，参与推出前七代TPU。在加入谷歌前，他曾在英伟达任职约八年，担任工程高级总监，负责组建并领导系统级芯片设计团队，参与GPU和Tegra等芯片研发。 他也不是Anthropic近期引入的首位定制芯片人才。今年6月，OpenAI定制芯片团队早期成员Clive Chan加入Anthropic。Chan曾参与OpenAI与博通的芯片项目，是该团队早期核心成员之一。 同时，Anthropic也在与三星电子讨论潜在制造合作。知情人士称，Anthropic仍处于确定芯片功能、性能和部署方式的早期阶段，尚未进入详细设计、测试和制造环节，但正在考虑采用三星2纳米制造工艺和先进封装技术。 不过，这并不意味着Anthropic准备摆脱英伟达、谷歌或AWS。该公司已经明确表示，AWS、谷歌、英伟达和AMD提供的硬件仍将是扩大算力的核心。自研芯片更可能成为现有供应体系之外的补充，用于针对Claude的具体需求优化计算效率，同时降低对单一供应商的依赖。 Anthropic选择在IPO前推进这项业务，也与公司未来的资本需求有关。模型规模和用户数量持续增长后，即使单次推理的效率只提高一部分，放大到大规模运行，也可能显著影响计算成本。 这也是Anthropic必须向投资者解释的一笔账：营收增长越快，需要投入的基础设施就越多，而未来利润能否覆盖这些成本，将直接影响2万亿美元估值能否成立。 上市之前，先把控制权安排好 除了财务和基础设施，Anthropic还在调整上市后的治理结构。 该公司是一家公益公司（PBC），管理层在法律上可以同时考虑股东利益之外的社会目标。2023年，Anthropic又成立了长期利益信托，由既不是公司员工、也不是投资者的顾问团队组成。 目前，该信托拥有一项重要治理权，可以选举Anthropic七人董事会中的多数成员。Anthropic通过Class T股票赋予信托这一权力，而这类股票本身不具有经济权益。 信托成员包括美联储前主席本·伯南克（Ben Bernanke）。今年另一名成员、Anthropic全球事务主管马里亚诺 - 弗洛伦蒂诺·库埃拉尔（Mariano-Florentino Cuéllar）离开后，目前信托只剩三名成员。 IPO之后，外部投资者进入公开市场，创始团队的持股比例还会进一步被稀释。据两名知情人士透露，Anthropic正在考虑向CEO达里奥·阿莫迪（Dario Amodei）和其他联合创始人提供具有额外投票权的股票，让创始团队在上市后仍能保持更大的控制力。 阿莫迪目前持有Anthropic约2%的股份。与经济权益相比，超级投票权股（super-voting shares）能够让创始团队以相对较低的持股比例获得更高的投票权。 这种安排并不罕见。SpaceX在6月IPO前采用了双层股权结构，赋予埃隆·马斯克超级投票权股票。Meta和Snap等科技公司也采取过类似方式。 Anthropic的特殊之处在于，该公司已经存在长期利益信托这一治理机制。因此，此次IPO不仅要确定创始人和投资者之间的经济利益如何分配，还需要处理创始团队与长期利益信托之间的控制权关系。 具体投票权安排目前尚未最终确定，相关方案仍可能发生变化。 最大考验是增长能否继续 Anthropic目前最需要向资本市场证明的，是高增长能否持续。 过去一年，该公司年化营收和私募估值持续增长，Claude Code等产品又不断扩大企业市场。但与此同时，Anthropic的资本需求也在快速增加。 2025年，Anthropic净亏损约420亿美元，约为上一年的5倍。虽然今年第二季度调整后营业利润已经转正，但该公司仍需要持续投入大量资金建设和租用数据中心、采购芯片以及获得能源资源。 投资者已经开始关注，如果AI模型价格持续下降，或者开源模型进一步扩大市场份额，Anthropic能否保持目前的收入增速和利润率。 此外，来自中国的低成本开源AI产品也是Anthropic需要面对的竞争。开源模型可以以更低价格提供服务，可能进一步影响高端模型的定价能力。 数据中心则是另一项风险。 Anthropic和OpenAI都在推动基础设施合作伙伴快速扩建数据中心，但美国社会对AI基础设施建设的反对正在增加。盖洛普（Gallup）5月发布的一项调查显示，七成美国人反对在自己所在地区建设AI数据中心，其中接近一半的人表示“强烈反对”。 数据中心建设已经成为部分州的政治议题。对于Anthropic而言，如果数据中心建设速度受到限制，该公司获得计算资源的速度也可能下降，而算力又直接关系到模型服务和收入增长。 Anthropic还面临与美国政府的摩擦以及版权诉讼等问题，这些因素都可能成为IPO招股说明书中的风险因素。 Anthropic的IPO，最终要面对的是AI行业从高速扩张走向规模化经营后的现实考验。过去几年，资本愿意为模型能力、用户增长和算力投入支付越来越高的价格，但进入公开市场后，投资者还会进一步追问收入增长的质量、基础设施投入的回报以及盈利能力何时能够兑现。 对Anthropic而言，2万亿美元估值对应的不只是Claude今天的表现，还包含市场对未来几年AI需求持续增长的预期。随着公司从一家快速成长的AI实验室走向上市公司，这套预期能否转化为稳定的收入和利润，将成为资本市场重新评估Anthropic的关键。 这也让Anthropic的IPO具有了更直接的行业意义：AI公司的估值逻辑，正在从“模型能做到什么”逐渐转向“模型能够创造多少可持续的商业价值”。 本文来源： 腾讯科技 风险提示及免责条款 市场有风险，投资需谨慎。本文不构成个人投资建议，也未考虑到个别用户特殊的投资目标、财务状况或需要。用户应考虑本文中的任何意见、观点或结论是否符合其特定状况。据此投资，责任自负。", "points": ["2026年下半年，Anthropic正在加速推进IPO。它要争取的，不只是一次可能超过1000亿美元的融资，还有让公开市场接受一家仍重度依赖算力投入的AI公司，能够接近2万亿美元的估值。 为 构对承接池出具的评级报告以及法律意见书进行投资，外加平台机构配合积极性有限，对底层资产进行高比例覆盖穿透核查的难度较高。即便平台机构充分协同，贷款合同等相关信息有效共享，但因贷款转让未通知债务人等原因，与借款人就贷款的真实性进行逐笔确认也难以落实。 二是期限实时匹配难。 基于产品设计原因，部分消费金融非标资产有可能因借款人在资产入池封包后，选择二次分期而导致债权的期限超过理财产品的期限。虽然基础资产转让合同要求放款池管理人及时履行赎回义务，但是不同平台项下放款池贷款人履约时限并不一致，致使投资期限内，理财产品期限难以与底层资产期限做到完全匹配。 三是投后管理难。 不同助贷平台提供的资产监测信息的时效及标准不一致，导致理财产品所投资的资管产品难以准确反映所持资产的风险收益状况，进而可能影响理财产品估值的准确性。 上述文章因此建议理财公司以管理的理财产品与贷款机构开展同业借款；贷款机构以融资发放的消费贷款债权及贷款回款账户，为上述借款提供质押担保并办理质押登记。 6月底某助贷平台被立案侦查，使得市场对此类消费贷资产的风险担忧上升。“据说有一些合作的小银行、消费金融公司也受影响了。”一位业内人士告诉记者。不过，理财公司合作的互联网平台大多为大型互联网平台，规范程度可能高于这家助贷平台。 银行业理财登记托管中心数据显示，截至今年6月末，理财产品投资资产合计已达到36万亿元。其中，投资非标资产余额为1.82万亿元，占比为5.1%，与年初持平。 本文来源： 21世纪经济报道 风险提示及免责条款 市场有风险，投资需谨慎。本文不构成个人投资建议，也未考虑到个别用户特殊的投资目标、财务状况或需要。用户应考虑本文中的任何意见、观点或结论是否符合其特定状况。据此投资，责任自负。", "points": ["21世纪经济报道记者从多个消息源获悉，近期理财资金的投向中多了一个限制，不允许投资消费贷非标资产。 “我们已经接到上级通知，说消金非标不能投了。”某城商行理财公司投资经理告诉21世纪经济报道记者。 “目前不让新增，存量自然到期。”另一家股份行理财公司投资经理也确认了该消息。 数位理财业内人士对记者表示，今年上半年某助贷平台被立案侦查，行业需要重新审视消费贷非标资产的风险。也有人表示，年初就有类似要求，已经开始照此执行一段时间了。 不过这次限制投资也不意味着理财行业全面封堵消费…"], "takeaway": "", "link": "https://wallstreetcn.com/articles/3780255", "source": "华尔街见闻", "category": "finance", "category_name": "财经与商业", "score": 93.9, "published": "2026-08-25T10:54:14+00:00", "ai": false}, {"id": "afc13f682c8f", "title": "公募基金公司上半年盈利回暖 头部规模壁垒强、明星公司利润暴增", "summary": "多家基金公司业绩随上市公司2026年中报出炉，净利普遍大增，永赢、财通因明星产品利润大增，尾部公司也收窄亏损 【财新网】 上市公司2026年半年报进入披露密集期，其控股参股基金公司的经营数据随之出炉。截至8月25日，已有24家基金管理公司公布了上半年的财务情况。整体来看，24家公司上半年营收合计约334.09亿元，净利润合计约88.64亿元，两项指标的同比增幅分别达43.76%和47.41%，行业整体盈利能力显著回暖。 从整体格局来看，行业呈现显著的梯队分化与马太效应。净利润超10亿元的头部四家公司贡献了全行业超过一半的利润，规模壁垒持续巩固；南方基金是唯一净利润突破15亿元的公司，达15.03亿元，营收50.14亿元。自2023年以来，公司上半年净利润已连续四年保持增长，今年同比增幅超过25%。华夏基金是目前唯一一家营收超55亿元的基金公司，截至报告期末，营收达57.08亿元、净利润14", "content": "多家基金公司业绩随上市公司2026年中报出炉，净利普遍大增，永赢、财通因明星产品利润大增，尾部公司也收窄亏损 【财新网】 上市公司2026年半年报进入披露密集期，其控股参股基金公司的经营数据随之出炉。截至8月25日，已有24家基金管理公司公布了上半年的财务情况。整体来看，24家公司上半年营收合计约334.09亿元，净利润合计约88.64亿元，两项指标的同比增幅分别达43.76%和47.41%，行业整体盈利能力显著回暖。 从整体格局来看，行业呈现显著的梯队分化与马太效应。净利润超10亿元的头部四家公司贡献了全行业超过一半的利润，规模壁垒持续巩固；南方基金是唯一净利润突破15亿元的公司，达15. 浦江沿岸地区北至吴淞口、南至闵浦三桥，覆盖流域两岸总长约124公里；苏州河沿岸地区西至嘉松北路，东至苏州河河口，覆盖流域两岸总长约73公里。统筹范围侧重上游区段的生态系统构建，黄浦江、苏州河上游分别抵至上海行政边界。中长期开发建设从生态系统整体性和流域系统性出发,统筹“一江一河”骨干支流河道及滨水单元区域。 根据《规划》设置的主要指标，到2030年，黄浦江沿岸预计新增滨江绿地及公共空间面积累计达到100公顷；苏州河沿岸预期活化提升滨河绿地及公共空间面积累计达到100公顷；“一江一河”预计新增滨水贯通岸线长度累计达到干流4公里、支流48公里。 随《规划》一同发布的政策解读介绍，黄浦江沿岸地区将坚持错位发展，以高品质公共空间为引领加快构筑核心引领功能集聚区，重点推进七个方面的任务： 一是延展秀带，系统构建“一江一河一带”蓝绿网络。多措并举拓展延伸滨江开放区域，聚焦重点打造滨水地标节点，联通激活垂江生态廊道，以干流水系牵引激活腹地发展潜能，扩大滨水空间贯通开放辐射圈。 二是提振活力，打造文商旅体展融合的城市会客厅。加快示范性文旅项目创建，提升场馆设施能级，加强水陆资源联动，提升品牌文体节赛活动举办频次和能级，全面激活滨水空间的文化、旅游、体育、商业价值，充分释放滨水空间经济活力与文化魅力。 三是复合利用，营造全龄包容共享的高品质场所。推动无障碍环境改造提升，构建覆盖多元需求的全龄友好服务体系，推动既有公共服务设施复合利用和市政设施转型升级，打造彰显城市温度的世界级滨水区。 四是水陆联动，建设顺畅便捷高效韧性的综合交通网。持续探索越江通道兼顾慢行功能，加密腹地衔接通道，同步强化两岸互动与水上功能拓展，加快构建高效畅达、水陆联动、智慧韧性的现代化立体交通体系。 五是错位发展，加快形成高质量发展增长极。一江两岸整体谋划，深化滨江地区整体定位和战略研究，加强功能融合复合，提升品质能级，强化政策保障，将黄浦江沿岸地区建设成为引领上海城市发展的战略空间，突出新时代上海高质量发展的新理念、新格局。 六是持续更新，彰显世界级滨水区文化底蕴。以有机更新激活各类资源价值潜能，推动工业遗存向文化地标跃迁、生产岸线向活力水岸转型，构建文脉传承与功能升级相融合的滨水更新样板。 七是协同善治，构建智慧联动的高效能治理典范。持续提升治理服务水平，依托智慧化手段精准匹配需求，充分发挥精细化治理效能。完善跨部门、跨区域协同机制，积极引导沿岸企业等多元主体参与公共空间运营，实现政府引导、社会调节与居民自治的良性互动，打造彰显城市温度、富有治理韧性的新时代人居画卷。 同时，苏州河沿岸地区将加强联动统筹，以城市有机更新提升重塑区域性功能节点，重点推进五个方面的任务： 一是开放共享，构筑安全宜人的品质水岸。整体推动岸线贯通提质、滨水景观绿地塑造，提升岸线生态韧性及景观风貌，加强活力空间营造与界面开放融合，系统构建开放共享、安全韧性、与市民生活深度融合的高品质水岸。 二是空间焕新，构建复合多元的活力水岸。推动全龄友好场景建设，激活沿河存量空间价值，增强沿岸商业休闲功能，促进公共文化设施开放共享，优化苏河驿站功能服务水平，全面提升苏河沿岸服务品质与活力能级。 三是优化交通，营造舒适安全的慢行网络。持续优化苏河两岸综合公共交通体系，通过加密垂河通道、优化临河道路慢行路权、加强腹地轨交慢行衔接，系统提升慢行品质。 四是文旅融合，彰显人气集聚的苏河新景。进一步活化文化遗产，挖掘文旅资源，构建特色节庆赛事和常态化水上运动相结合的多层次水上活动体系，完善旅游服务配套与标识指引，全面激活水岸经济活力，塑就传统现代交融、产业生活共栖的人文水岸体验。 五是多元参与，构建更具包容的现代化治理体系。创新体制机制，拓宽参与渠道，治理模式向协同共治深度转型，滨水空间管理养护水平持续提升，打造超特大城市河流多方献策、高效治理的生动实践。", "points": ["未来五年，上海黄浦江两岸会有哪些值得期待的新变化？苏州河沿岸将怎样更好融入市民日常生活？ 据上海市人民政府官网2026年8月25日消息，近日，《上海市“一江一河”发展“十五五”规划》（以下简称《规划》）发布。 《规划》提出，至2030年，黄浦江沿岸地区逐步建成引领未来发展的创新走廊、文化内涵丰富的城市客厅、彰显绿色生态的蓝绿新画卷、联动水岸与腹地的发展引擎。苏州河沿岸地区逐步建成凸显上海人文的风貌展示带、多元包容的都市活力区、共建共治的社区纽带、更新焕活的宜居宜游目的地。到2…"], "takeaway": "", "link": "https://m.thepaper.cn/detail/33846617", "source": "澎湃精选", "category": "society", "category_name": "社会与深度", 地罚站半个小时后，即使事前涂了身体乳做保护， 小葵腋下的皮肤还是被漂膏刺激得通红，但腋毛的颜色却一根没变。 不死心的小葵又用眉毛漂膏重新涂一遍，再熬一轮，前后折腾两个多小时，她终于得到了金色的腋毛。 选金色的原因不是因为喜欢，这已经是相对省事的颜色，只漂一道，不用二次上色。 想要获得蓝色腋毛，则需要先漂再上色丨 要问小葵对染腋毛的最大感受，那就是远比想象中麻烦。但即便这样麻烦，今年夏天，尝试染腋毛的年轻人却越来越多。 在小红书搜索“染腋毛”，你会打开一个彩色的新世界： 蓝色、紫色、红色……甚至独角兽一样的五彩腋毛，出现在不同女生的胳肢窝里。有人晒出刚染完的蓝色腋毛，隔几天又更新一条“原来腋毛的生长速度这么快”；有人认真写步骤，从头到尾讲解怎么把这玩意儿染成绿色的…… 小红书上，年轻人晒出各种颜色的腋毛 这并不是一件新鲜事，早在2011年，Lady Gaga就曾把腋毛染成葱绿色后出现在公开场合。此后几年，彩色腋毛、glitterpits（闪亮的腋下）也陆续进入大众视野。到了2019年， 一名21岁的英国女生发起“Januhairy运动”，鼓励女性每年1月不剃体毛，接受自然的自己。从这时起，染腋毛的意义悄悄变了。它不再只是一种时尚潮流的表达，而更像是“夺回身体自主权”的象征：我的身体，我说了算。 毕竟，在做出染腋毛的决定之前，几乎所有女孩都曾被同一个问题困住过——女性，是不是必须要脱腋毛？ 你胳肢窝下面怎么长毛了？ 初中时，闪闪看到妈妈在卫生间处理腋毛，好奇地问为什么要剃掉，妈妈没能给出一个完整的解释。后来上了高中，闪闪开始意识到自己身边的人、看过的影视剧角色，所有女性的腋下都是“干净”的。 这让闪闪有所警惕：宽松的校服只要一抬手，就可能被人看到腋下，那腋毛是不是不该出现？既然大家都这样做，闪闪也跟着照做， 她买了激光仪开始脱毛，但那天问妈妈的问题始终没有答案。 和闪闪不同，有腋毛是一件羞耻的事，小葵在五年级就知道了。 在一次和同伴的玩耍中，她被对方突然问到：“你胳肢窝下面怎么长毛了？”小葵不知道什么是腋毛，更无从得知，这是每个人在青春期都会出现的发育现象，她只是感到无比的羞耻，恨不得马上消失。 藏起来，是小葵当时能想到的唯一办法。从那以后，她再也不敢穿任何无袖的衣服，袖子成了隔绝外界视线的屏障。除了把腋毛藏起来，也把自己藏起来：她再也没跟那个男生一起玩过。 那一天的羞耻感像一根细刺，在小葵心里扎了很多年。黑色、不好看、脏脏臭臭的，成了她对腋毛的全部印象，厌恶感让小葵始终无法直视腋毛。 《老友记》中莫妮卡和菲比尝试“无痛”脱毛膏 女生的腋下应该是干净的、腋毛不该露出来，这套规则很少被明说，但异样的眼神、无端的质疑又让它无处不在。而脱毛，就成了服从这套规则最直接的方式。 比起以上这两段相对“温和”的经历，吴心怡的朋友则经历了一次彻底的网络暴力。 她的朋友在社交平台发了一张露出腋毛的照片后，留言区和私信涌入大量评论，有像“恶心”、“骚货”这样的恶意攻击，也有像“好美的腋毛”这样的骚扰和嘲讽。一开始，朋友还试着去争辩和回击，但每天看到这些不断更新的言论，情绪和精神都被严重消耗，最后只能选择把帖子隐藏。 吴心怡了解周围环境对于女性腋毛的排斥，但如此赤裸裸的恶意就发生在自己身边，还是让她深感震惊和愤怒。 吴心怡朋友在后台举报的恶意言论 吴心怡已经在美国生活了8年，她一直知道， 在西方国家，女性脱毛是一件“普遍的行为”，甚至被视作是一种社交礼仪。如果不脱，会被认为这个人懒散、无礼、不卫生。 为了不遭受异样的凝视和评判， 每周一次的脱毛是她不想但又不得不履行的“女性义务”。她研究过各种脱毛的手段，为了减少疼痛还是只能选最原始的剃毛刀。她曾一口气买了有6个替换头的剃毛刀，只为了在需要参加晚会、或是上游泳课的时候有个“干净的身体”。 朋友的遭遇开始让她反思，为什么人人都会生长的腋毛，放在女性身上，就会带来这样的攻击？她想做点什么来支持朋友： “很多人觉得留女性不应该有腋毛，是因为他们接触到的大都是脱了毛的人，所以我觉得增加腋毛可见度是一件重要的事情。” 吴心怡决定，今后再也不要脱腋毛了。 保留腋毛拍照的吴心怡 染腋毛，一种“安全的叛逆” 即使一个女生，在成长过程中没有遇到过任何关于腋毛的负面评价，也没有任何心理上的羞耻感，但脱毛这件事本身就有着不少扎实的坏处。 脱毛后新长出的腋毛触感上会比之前更扎；直接拔除毛发，或过于频繁地脱毛都可能导致毛囊炎；如果使用刺激的化学产品，还可能使皮肤屏障受损引发感染。总之，脱腋毛的坏处远不止“麻烦”。 染腋毛解决了“不想脱”和“不敢漏”之间的矛盾，成了女孩们和腋毛的第三种相处方式。 小葵过去一直在坚持脱毛，染腋毛的出现，就成为了她的一次“安全的叛逆”。她是在无意中刷到了一个给腋毛染色的博主，视频里的女生一边讲述着腋毛自由，一边大大方方地展示自己火龙果色的腋毛。小葵觉得那特别又好看。 染完腋毛的小葵，打扮后出去拍照 一直不敢漏出的黑色腋毛，染上颜色后反而成为一种点缀，能在夏天肆无忌惮地抬起胳膊展示，在她看来格外地有生命力。 闪闪的出发点完全不同。Lady Gaga在演唱会上的照片给她留下了深刻印象——“她的头发是什么颜色，腋毛就是什么颜色，这样的处理真是疯狂又夸张。” 这让闪闪觉得，大家避之不及的腋毛，竟然可以成为表达的一部分。 Lady Gaga 2011年在加拿大的现场表演，她佩戴青蓝绿松石色假发，并搭配同色假腋毛 于是在高三毕业后的暑假，闪闪决定彻底解决一下腋毛的问题。她主动查了关于腋毛、体毛的资料，又看了不少女性博主的视频科普，那个一直困扰她的疑问终于有了答案，“社会规则”要求女性脱毛这件事根本没道理：腋毛不仅可以排汗散热，还能减少皮肤摩擦、阻挡灰尘细菌。 但她没办法立刻、完全接受露出腋毛——在意别人的眼光是真的，自己没准备好也是真的。想打破“社会规则”的闪闪，最后决定用“染”代替“脱”，为自己争取心理上的缓冲空间。 2023年的暑天，18岁的闪闪第一次漂了腋毛，是她喜欢的黄色。 到目前为止，她一共染过3次腋毛，每次染完，她都觉得离“完全接受真实的自己”又近了一点。 第一次染完腋毛的闪闪 当彩色的腋毛，被人“看见”之后 小葵还记得染完腋毛的第二天，她和朋友去嘉兴的野外吃了野火饭。这是江南地区的野炊习俗，用土灶烧一大锅糯米饭，里面有笋、豆子、香肠、咸肉和各式各样的小菜。 它还有一个名字叫“立夏饭”，吃完这一餐，代表着夏天就要开始了，不用把腋毛“藏起来”的夏天开始了。 小葵那天特意画了浅橘色的眉毛，穿着吊带，在土灶前抬起胳膊拍照，金色腋毛在阳光下亮晶晶的。那是她很久以来第一次觉得，自己的腋毛不丑了，别人看到只会觉得很特别。骄傲，盖过了所有染腋毛时的麻烦。 小葵把自己染腋毛的照片分享到朋友圈，得到了朋友们的一致夸赞：大胆、特别、突破了自己的禁锢。还有朋友被种草、专门跑来请教染腋毛的教程，没人会觉得这是件不好的事。 吴心怡染腋毛的经历多少有些突发奇想。在一次聚会中，她用朋友染发剩下的染膏，把自己的腋毛染成了橙色，事后她将染后的腋毛照片发布在小红书和Instagram。吴心怡说，因为自己的腋毛量偏少，橙色又和肤色相近，现实中其实很少有人留意到她的腋毛，但线上分享却收获了大量正向反馈。 外国朋友看到吴心怡的分享后发来了消息 评论区和私信里，很多女生向她倾诉自己被脱毛折磨多年，却始终不敢放下剃刀。她印象特别深的一个留学认识的外国朋友，喜欢运动，懒得剃毛，但又长期被美国的“同辈审美”所裹挟，对方说吴心怡的帖子“给了她很大勇气”。 这些陌生人的支持，让她在保留腋毛时变得愈加有底气，即便在生活中有人注意到自己的腋毛，也不会再担心对方有没有露出异样眼光。 有趣的是，吴心怡“染橙色腋毛”的几条帖子下，几乎没有负面评论，反而是她发的一些普通自拍、没有强调腋毛的话题内容下，却招来了恶臭评论：“有人就喜欢不脱毛的女人”。 吴心怡染后的腋毛 小葵和闪闪也都在社交平台发布过染腋毛的帖子， 公众视野下的分享，回馈的并非都是正面的声音。 在小葵的小红书笔记下，不少男性留下带有挑逗意味的留言，甚至有人伪装成女生，打着讨教漂腋毛细节的幌子加了小葵微信。起初小葵满怀善意，事无巨细地分享细节，直到对方反复把话题拉扯到 “给我看看你漂腋毛前的照片”“你的腋毛有味道吗”“我有个男性朋友闻过别人腋下……”这才让小葵察觉到不对。 而闪闪的笔记发布在3年前，那时关于腋毛的讨论远没有现在多，评论区是满满的质疑和嘲讽，闪闪一条条回复，一遍遍解释，但没什么用。 闪闪至今没删掉那篇笔记：“我留着它，只是把所有通知都关掉了。” 不该存在的“腋毛羞耻”和“腋下管理” 闪闪不喜欢“腋毛羞耻”这个词。 更不喜欢把染腋毛看成是一场对抗羞耻的斗争。在她的理解里， 羞耻心的存在并非是个人的原因，而是是整个社会长期教化的结果：电视上的女性腋下永远光洁，广告中的脱毛产品层出不穷，身边人默认脱毛是理所当然的事。在这样的环境里长大，排斥腋毛几乎是一种本能。 图源bilibili@漠兔MOTO 吴心怡记得小时候在国内时，妈妈那一代人不会脱腋毛。或许是受了西方文化的影响，也或许是商家为了卖刮毛刀、脱毛仪，才渐渐变成了如今“全民脱毛”的局面。 “腋下管理”这个说法就是最好的例子。 不知从什么时候起，脱毛被归入了“身体管理”的范畴，和健身、护肤并列，仿佛胳肢窝里的那几根毛发，是一项需要定期处理、否则就失职的工作。 但只要稍加思考，就能意识到这是一个可恶的伪命题：为什么男性的腋下不需要被“管理”？ 这套双重标准背后，是把女性的身体置于他人目光之下的审视逻辑，你的身体是要给别人看的，所以必须符合期待。 《科隆女孩》剧照 小葵至今没能完全摆脱对腋毛的羞耻感，她最近换了新工作，面对不熟悉的同事会下意识地没有安全感，纠结能不能穿吊带。她不是不知道体毛正常，只是多年积累的心理惯性不是一次漂染就能彻底消除的。 羞耻感的消退需要时间，更需要一个宽容的环境，当露出腋毛不再是一件需要勇气的事，“腋毛羞耻”这个词才会失去意义。 吴心怡的态度更加松弛，她从不试图劝说任何人，也并不觉得保留腋毛比脱毛更高级。她只是选择了自己舒服的方式，然后分享出来，让那些同样困惑的人知道：原来还有别的活法。 这三位染了腋毛的女孩，她们的故事各不相同， 但有一个共同点：染腋毛，从头到尾都不是关于“羞耻”，而是关于“选择”。 有人选择脱掉，有人选择保留，也有人选择增加一抹颜色，这些选择没有对错，也不需要被赋予多么特殊的意义。当我们跳出了“腋毛羞耻”的框架后，才能回到审美自主权的命题上。 女孩们的腋下长什么样，该由它的主人说了算。 （应受访者要求，小葵、闪闪为化名） 本文经授权转载自 后浪研究所（ID：youth36kr），如需二次转载请联系原作者。欢迎转发到朋友圈。 点个“小爱心”吧", "points": ["染腋毛，成了女孩们和腋毛相处的新方式。 撰文：娃娃菜 编辑：木也 封面来源：受访者提供 一把刷子、一盒50元的漂膏。小葵站在卫生间里，身上只穿着内衣，一只手高举过头顶，另一只手有些费力地把漂膏刷在腋下。刺痛感像细针一样扎进来，她咬牙保持着这个姿势，胳膊因为举了太久有些酸得发抖。 她要把自己的腋毛染成金色。 因为腋毛又硬又卷，还只能单手操作，要保证每一根毛都均匀地裹上了漂膏并非易事；涂完还要一直举着双手等待掉色，什么事都做不了。原地罚站半个小时后，即使事前涂了身体乳做保护， 小…"], "takeaway": "", "link": "https://www.guokr.com/article/470024/", "source": "果壳科学人", "category": "science", "category_name": "科学与健康", "score": 92.7, "published": "2026-08-25T08:15:07+00:00", "ai": false}, {"id": "c9ad4ae9ee61", "title": "上海：促进外资企业境内再投资 鼓励开展股权投资、并购投资", "summary": "据上海市人民政府8月25日消息，上海市人民政府印发《上海市加快国际贸易中心建设“十五五”规划》的通知。其中提到，积极扩大外资市场准入。深化服务业扩大开放试点，争取分类放宽准入限制，推进电信、数字、金融、医疗健康、商贸文旅、交通运输等重点领域扩大开放措施先行先试。促进外资转型与总部能级提升。支持外资企业开展本地研发、技术升级和绿色低碳转型。促进外资企业境内再投资，鼓励开展股权投资、并购投资。", "content": "据上海市人民政府8月25日消息，上海市人民政府印发《上海市加快国际贸易中心建设“十五五”规划》的通知。其中提到，积极扩大外资市场准入。深化服务业扩大开放试点，争取分类放宽准入限制，推进电信、数字、金融、医疗健康、商贸文旅、交通运输等重点领域扩大开放措施先行先试。促进外资转型与总部能级提升。支持外资企业开展本地研发、技术升级和绿色低碳转型。促进外资企业境内再投资，鼓励开展股权投资、并购投资。", "points": ["据上海市人民政府8月25日消息，上海市人民政府印发《上海市加快国际贸易中心建设“十五五”规划》的通知。其中提到，积极扩大外资市场准入。深化服务业扩大开放试点，争取分类放宽准入限制，推进电信、数字、金融、医疗健康、商贸文旅、交通运输等重点领域扩大开放措施先行先试。促进外资转型与总部能级提升。支持外资企业开展本地研发、技术升级和绿色低碳转型。促进外资企业境内再投资，鼓励开展股权投资、并购投资。"], "takeaway": "", "link": "http://www.eeo.com.cn/2026/0825/1011010.shtml", "source": "经济观察网", "category": "finance", "category_name": "财经与商业", "score": 92.4, "published": "2026-08-25T11:13:13+00:00", "ai": false}, {"id": "05dd45866ded", "title": "应急管理部针对山西、内蒙古、青海启动国家地质灾害四级应急响应", "summary": "中新网8月25日电 据应急管理部微信公众号消息，据气象部门预测，受台风和西南季风影响，8月25日至27日，山西中北部、内蒙古西部、青海东北部等地有中到大雨，部分地区暴 术界与产业界却爆发了一场剧烈的反思： 这些动辄数十亿参数的具身大模型，真的学会“举一反三”了吗？还是在“死记硬背”？ 在主流学术视角中，VLA 大模型像是给机器人装上了具备常识与规划能力的“大脑”。但要让机械体真正干好精细活，仅有一个聪明的大脑远远不够。 最新实验数据表明，面对物品位置的随机挪动或新指令组合时，纯端到端大模型往往会受到“空间过拟合”的约束，末端执行成功率会出现剧烈衰减。 这恰恰说明： 具身智能要真正走出实验室，不仅需要大模型提供常识和高层决策，更需要扎实的工程技术去打造精准、稳健的“小脑” 。 下面雷峰网盘点入选&nbsp; IJCAI 2026 &nbsp;的&nbsp; 6 项中国团队成果 。它们并非要替代大模型，而是从空间泛化、盲区感知到极端控制，为具身智能补齐了通往真实物理世界最关键的拼图。 01 解决死记硬背， 大模型如何搞定未见场景 具身智能的核心瓶颈之一在于真正的泛化能力。目前的VLA动辄拥有数十亿参数，但在面对没有见过的指令组合或场景变化时，表现往往大打折扣。 ▎ 泛化成功率跌破 21%：不重训模型，如何把成功率拉回 83% 论文 ：《VLAs Are Confined yet Capable of Generalizing to Novel Tasks》 作者 ：李全义（论文独立作者，一路从北邮本科、爱丁堡硕士深造至新加坡国立大学 CLeaR Lab 博士，现任 Oxa 高级应用科学家） 论文链接： 假设你给机器人下达了一道指令：“把奶酪放进柜子”。如果在训练数据里，这块奶酪总是摆在桌子左侧，那么当你在现实中把奶酪挪到桌子右侧时，会发生什么？ 在李全义博士最新的研究中，发生了令人啼笑皆非的一幕： 主流 VLA 大模型依然会机械地伸向桌子左侧 。 模型根本没有理解什么是“奶酪”，它只是把词汇与训练集里的固定物理坐标进行了强行绑定。 &nbsp;无论 是π₀ 、OpenVLA 还是 UniVLA，虽然它们在标准测试集里能刷出 95% 以上的超高成功率，但李全 义博士专门构建了 20 个外推新任务的&nbsp; libero-ood &nbsp;基准。 在这个不按套路出牌的考场上，主流 VLA 的成功率瞬间断崖式跌落到了&nbsp; 21% 以下 （OpenVLA 仅 1%， π₀ -fast 为 17%，UniVLA 为 21%）。原因是：大模型在决策时根本不关注物体本身，只盯着机械臂末端与终点坐标。 但这项研究最精彩的部分在于“反转”。李全义博士通过机制可解释性方法，从大模型内部提炼出了代表任务语义的“ 文本隐变量 ”。在模型残差流中实施“文本隐变量插值（TLI）”后， 在完全不重新训练模型的前提下 ，直接将 π₀&nbsp; 在外推新任务上的成功率从&nbsp; 9%提升到了 83% ！ 这项由中国年轻学者完成的独立研究，不仅用严谨的数据证实了现有的端到端微调确实落入了死记硬背的陷阱，更从底层表征上证明了 大模型内部早已蕴含了可组合的通用泛化潜能，只是过往粗暴的端到端训练并没有找到唤醒它的正确钥匙 。 ▎ 微调 0.63% 参数：4 小时练完视觉大模型，嵌入式芯片 63ms 响应 论文 ：《RepSAM: Bridging Foundation Models to Robotic Vision via Representation-Guided Adaptation》 作者 ：Chu Wenhui（德克萨斯 A&amp;M 大学） 论文链接： iv.org/pdf/2 605.25495 我们先来看两组极其悬殊的对比数据： 传统全量微调“分割一切”大模型 SAM（ViT-H）：需要训练&nbsp; 6.32 亿参数 ，耗时&nbsp; 384 个 GPU 小时 。 RepSAM 的适配方案：仅微调&nbsp; 400 万参数 ，单卡 A100 训练&nbsp; 4 小时 。 参数量缩减了 158 倍，训练速度提升了 96 倍，感知效果却达到了全量微调&nbsp; 97.9% 的水准 。它是怎么做到的？ Chu Wenhui 并没有盲目地对整个大模型进行“一刀切”式微调。他利用中心核对齐（CKA）理论对 SAM 的 32 层 Transformer 网络进行扫描后，发现了大模型内脏里的表征漂移规律： 浅层网络（L1-10）低阶特征的领域差异极其剧烈（CKA &lt; 0.5），必须分配高容量适配（Rank 16）； 中层网络（L11-22）处于中等特征过渡区（Rank 8）； 深层网络（L23-32）的高阶语义表征则高度通用（CKA &gt; 0.7），只需极低容量适配（Rank 4） 。 RepSAM架构图 靠着按需低秩适配，RepSAM 在面对透明玻璃杯、严重遮挡堆叠零件等传统视觉大模型经常失明的场景时，展现出了极其惊艳的感知力。 在 ClearGrasp 透明物体分割任务上，mIoU 从 SAM 零样本的 34.7% 暴涨至&nbsp; 90.1% ；在真实的 PyBullet 抓取物理仿真中，抓取成功率高达&nbsp; 94.4% ，碰撞率降低了 8.8%。 但在真实的工业抓取场景中，光有高精度远远不够。 算力开销与实时响应时延，才是技术能否走出实验室的关键 。 嵌入式机械臂与边缘控制器算力极其宝贵，根本无法承载动辄全量重训的重型视觉网络。而RepSAM 真正硬核的地方，恰恰在于它在保持高精度的同时，在嵌入式设备 Jetson AGX Orin 上跑出了低至&nbsp; 63ms (15.8 FPS) &nbsp;的响应时延。 这种对计算效率与表征规律的极致压榨，真正解开了工业级具身视觉在边端部署上的时延枷锁。 02 指令抽象、视线遮挡， 如何实现厘米级精准交互 进入真实场景后，机器人将面临两大感知杀手：一是人类给出的自然语言指令往往高度抽象，在连续空间漫游时极易迷路；二是当机械臂接近物体时，机械臂自身或周围障碍物会完全挡住摄像头，形成物理上的 视觉盲区 。 ▎ 连续空间导航：提取自然语言地标，陌生环境成功率提升 7% 论文 ：《FILD-Nav: Vision-and-Language Navigation with Instruction Landmark Features in Continuous Environments》 团队 ：Chuangye Hu, Lulu Liu, Huaiwei Si, Yawen Zhao, Nan Ding（中国学者团队） 英伟达 CEO 黄仁勋曾在 GTC 大会上对具身导航做过一个极其深刻的断言： 未来的具身导航绝非简单的几何建图与避障，而是语义理解与物理空间地理信息的深度交融。 当机器人从桌面搬运走向更大范围的真实连续空间时，这一断言在真实场景中显得尤为贴切。“绕过前面的木质办公桌，直走到厨房，在水壶旁停下。”人类听到这样的指令时，大脑会在移动过程中，不断用眼睛去校验“木质办公桌”和“水壶”这两个核心参照物。 但在连续环境下的视觉-语言导航任务里，现有算法在 航点预测（Waypoint Prediction）时往往缺乏高阶语义引导，在跨模态规划 中也缺少显式的“语言-地标”对齐。这导致机器人无法精准匹配指令里的物理实体，在跨长周期导航里走着走着就迷失了目标。 中国学者团队提出的&nbsp; FILD-Nav &nbsp;框架，正好给出了呼应这一行业趋势的硬核答卷。算法能自动从复杂的自然语言指令中提炼出与任务强相关的“地标特征（Instruction Landmark Features）”，并将地标语义双向注入到导航的核心环路中： 地标引导的航点预测 ：将地标语义融入航点生成，大幅提升预测航点与真实物理地标的相关性； 地标增强的拓扑规划 ：在跨模态规划中引入地标语义校验，使机器人具备了更稳健的长周期导航能力。 在权威基准数据集&nbsp; VLN-CE &nbsp;的广泛测试中，FILD-Nav 的导航成功率（SR）提升了&nbsp; 2% ，路径长度加权成功率（SPL）提升了&nbsp; 3% 。特别是在未曾见过的全新陌生环境里，其 Oracle 成功率（OSR）大幅提升了&nbsp; 7% 。 这种赋予机器人边走边用语言符号校验物理地标的高级认知能力，正是将黄仁勋所描绘的“语义与空间深度交融”落地为现实，为服务机器人走出实验室、迈入结构复杂的商场、医院与家庭场景打通了关键路线。 ▎ 最后一厘米视觉盲区：无需相机参与，150 个真实物体抓取率 97.3% 论文 ：《PECHC: Robust Tactile Grasping Stabilization in Vision-Denied Peripersonal Space》 团队 ：中国科学技术大学&nbsp; 董二宝教授团队 无论是 Meta 开源的 Digit 触觉感知平台，还是各类灵巧手在手指末端加装多轴触觉传感器，都指向了一个非常现实的行业共识： 要想让机器人学会做精细活，光靠眼睛是远远不够的。 触觉之所以被推到台前，根本原因在于视觉在接近目标“最后一厘米”时的天然盲区。 当机械臂手眼协同深入狭窄空间或接近目标时，相机视线会被夹爪和机械臂自身完全遮挡。加上相机标定误差，视觉信息在最后关头往往极其不可靠。没了视觉，传统的视物抓取算法失去视觉参照，极其容易产生碰撞失误，或者因无法感知接触力而把蛋挞、玻璃杯等易碎品捏碎。 中国科学技术大学董二宝教授团队提出的&nbsp; PECHC （物理演化级联约束与人类纠偏）算法，选择在视觉彻底失灵的近身盲区里，把控制主导权毫无保留地交给触觉。 为了彻底隔离触觉在多指协同中的独立贡献，团队采用解耦控制策略，将灵巧手工作空间内的抓握稳定设为一个无需视觉参与的“安全防御反射（Fail-Safe Reflex）”： 混合纠偏模仿学习 (HCIL) ：建立由失败触发的人机纠偏机制，仅需极稀疏的人类专家纠偏即可高效弥合模型差距； 级联约束调度 (CCS) ：施加物理上合理的行为约束（几何接近、力封闭与动态稳定性），一举弥合几何拓扑差距； 时序异构蒸馏 (THED) ：从历史触觉序列中进行隐式系统识别，精准弥合真实物理动力学差距。 在涵盖&nbsp; 150 个真实物体 （Visual Dexterity 数据集）的完全自主测试中，PECHC 展现出极高的鲁棒性：实现了&nbsp; 97.3% 的真实机器人抓取成功率 ！ 整个测试过程中，仅需 1 个物体进行一次性 HCIL 校准，其余 149 个全新物体在没有任何干预的情况下全部轻松搞定。相比传统的 Sim-to-Real 强化学习 Baseline（带域随机化的 Vanilla PPO），PECHC 性能大幅提升了&nbsp; 42.8% ，并且在抓取易碎物品时展现出了类似人类手掌的细腻调力能力。 团队用实打实的 97.3% 真实成功率证明了：当视觉退场后，高阶触觉感知才是让机器人安全触达物理世界的最终屏障，也展现了中国学术机构在灵巧手触觉控制领域的突破。 03 极端控制：面对强风暗流， 如何防止强化学习算法崩盘 当具身智能从理想的室内实验室走向户外、高空或海洋，算法面临的威胁不再只是简单的视觉遮挡或空间位置变化，而是充满了高度随机性与非线性的 真实物理世界扰动 。 在海浪冲刷、复杂洋流、强阵风以及高异构传感器噪声的夹击下，缺乏鲁棒防护的传统算法极其容易发生价值函数崩溃，甚至引发致命的碰撞与坠毁。如何让机器人在极端环境中保持稳健控制？中国学者们在控制算法的底层数学设计上交出了一份满意的答卷。 ▎ 极端海况抗扰：分布鲁棒替换反向传播梯度，碰撞率下降 12.28% 论文 ：《Perturbation-mitigated USV Navigation with Distributionally Robust Reinforcement Learning》 团队 ：香港科技大学（广州） 熊辉教授团队 强化学习教父 Rich Sutton 曾提出过著名的“苦涩的教训（The Bitter Lesson）”，认为纯粹基于数据和算力的通用算法，终将战胜人类精心设计的物理规则。 然而，当算法从理想的计算机仿真走到残酷的物理世界时，纯数据驱动的脆性便暴露无遗。以无人水面艇为例，当它行驶在充满了未知暗流、隐蔽礁石以及恶劣天气的真实海面上时，传感器观测噪音会随海况剧烈波动。这种高度异构且非平稳的观测干扰，极其容易导致传统强化学习算法的价值函数彻底崩溃，引发致命的碰撞与迷航。 香港科技大学（广州）熊辉教授团队提出的&nbsp; DRIQN （分布鲁棒隐式分位数网络）算法，选择用极其优雅的数学手段，给纯数据驱动的强化学习穿上了一套“防护罩”。 论文链接： 面对海量且复杂的噪声干扰，团队没有采用增加复杂辅助模块的“重型架构”，而是做出了两项关键突破： 回放池显式子组建模 ：将经验回放池中的转移数据按噪声模式划分为J个同质子组，专门对异构噪声与最坏工况进行显式建模，巧妙地将原本计算极其复杂的点级 DRO 优化，转化为高效的子组级损失优化； 轻量化“梯度替代”机制 ：利用分布鲁棒优化（DRO）求解出的对偶二次规划，直接替换神经网络最后一层的反向传播梯度。这样既完整保留了深度网络高阶特征表达的优势，又让算法天生具备了抵御最坏工况的鲁棒性。 在叠加了 4 个水流涡流、6 个随机礁石障碍物以及高强度传感器噪声的模拟极端海况下，DRIQN 展现出了极其硬核的抗扰稳定性。相比顶级基线模型，它不仅将导航成功率提升了&nbsp; 13.51% 、碰撞率降低了&nbsp; 12.28% ，还在成功航次中同时实现了&nbsp; 35.46% 的省时 与&nbsp; 27.99% 的节能 。 即便面对传感器突变与数据丢失交织的复合故障，DRIQN 依然以&nbsp; 58% 的全场最高成功率 和最低超时率跑赢了所有对手，做到了安全性、能效与容错力的全面兼容。 熊辉教授团队的这项成果证明了，纯数据驱动的 RL 在复杂的物理世界里绝不是万能的。通过在梯度更新层面无缝融入分布鲁棒性，为无人艇、无人机乃至各类工业巡检机器人如何在极端物理扰动下保持可靠决策，提供了一份硬核的工业级答卷。 ▎ 突发强侧风控制：空气动力学与强化学习混合，毫秒级估计风场 论文 ：《Disturbance-Aware Hybrid Learning for Robust and Adaptive UAV Flight in Extreme Winds》 团队 ：重庆大学 古富强团队 在大地之上的高空，无论是高压输电线的野外巡检，还是狭窄山谷里的搜救探险，突如其来的强阵风始终是无人机最致命的噩梦。 传统 PID 或模型预测控制（MPC）在面对非线性强风时响应滞后；而纯深度学习控制在面对未曾见过的风场时极易产生过拟合，一旦遇到突发侧风，无人机极易失控翻机坠毁。 重庆大学古富强团队提出的扰动感知混合学习（Disturbance-Aware Hybrid Learning）架构，切中了极端风况自适应控制的核心痛点。 算法构建了一个实时风场扰动感知模块，能像飞鸟的羽毛感知气流一样，毫秒级实时估计作用在无人机机体上的非线性气流扰动特征。随后，它将传统空气动力学物理模型与数据驱动的强化学习策略进行动态混合（Hybrid Learning），根据实时感知到的扰动强度毫秒级调整控制权重，实现了极端风况下的平稳悬停与高精度轨迹跟踪。 这项研究，切中了低空经济发展中最核心的安全刚需，正是无人机从“摄影工具”跃迁为“全天候工业级生产力工具”的关键技术桥梁。 04 结语：在 Scaling Law 的信仰之外， 寻找物理世界的硬解 梳理完这 6 篇研究，最触动人的其实是一种路线的分野。 当 Physical Intelligence 和 Figure 这些硅谷明星团队倾尽算力和数据去押注VLA 大模型的 Scaling Law时，他们试图重演大语言模型的奇迹：相信只要模型参数足够大、视频喂得足够多，通用的物理控制能力就会自然“涌现”。 但这套逻辑在真实的物理世界里，正频频碰壁。真实场景充斥着摩擦力、相机盲区、突发的阵风和传感器噪声。面对这些毫无规律可言的物理死角，端到端黑盒模型的泛化表现往往比预想中脆弱得多。 相比之下，这 6 篇来自中国学者和科研机构的成果，展现出一条极其清晰的“物理工程主义”路线。 大家不再盲目追逐参数规模，而是直接拆解大模型的内脏，用 CKA 理论摸清表征漂移，拿 0.63% 的参数量就把视觉大模型嵌进边缘芯片。在镜头完全失灵的最后关头，不靠算法去凭空盲猜，而是直接把控制权交给毫秒级响应的触觉反射；面对海浪和强风的袭扰，则从数学底层入手，用分布鲁棒优化直接给强化学习的梯度更新安上防护罩。 具身智能不能只停留在展台炫技。真正的产业落地，绝不会诞生在无限堆叠数据的实验室里，而属于那些能精算算力成本、硬刚真实物理环境各种复杂扰动的方案。 IJCAI 2026 要来了，你还在单打独斗？ 为了方便大家抱团交流、互通会议消息，我们专门建了 &nbsp; IJCAI 2026 参会群 ！进群你会解锁这些「福利」 ? 会议情报站 ： 投稿 DDL、格式规范、评审进度……关键节点第一时间送达，再也不怕错过 deadline，投稿准备稳稳的。 同行茶话会 ： 天南海北的同行都在群里，聊心得、碰思路、攒人脉，科研路上我们同行。 前沿补给站 ： 最新研究成果、热点方向实时同步，结合会议主题帮你捋清投稿脉络，给论文灵感加满油。 现场后援团： （会议期间专属开启）： 到了会场也不用慌—— 路线导航 ： 场馆分布、报告厅怎么走，群里随时问； 议题共读 ： 热门 session、Keynote 现场探讨，错过也能追； Poster 汇编 ： 现场海报精华整理，一键收藏不遗漏； 约局广场 ： 约饭局、采访局、交流局……想唠嗑、想合作、想面基，群里发起就成。 ? 进群传送门： &nbsp;扫码进群或添加微信 Qvv0909777 ，备注：IJCAI &nbsp;+ 单位/学校+姓名+方向 。 搞科研/搞技术，信息差很重要。 来，一起快人一步！ 上车，带你看遍全球 AI 顶会精华 可独家畅览： 专家演讲PPT 大会报告全文 热门论文解读 学术新星访谈 扫描上方二维码 或点击 「 阅读原文 」 关注专区。", "points": ["告别理想仿真，中国学术团队用物理工程方案回应落地挑战。 &nbsp; &nbsp; 作者丨 张璐 &nbsp; &nbsp; 编辑丨 岑峰 &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &n…"], "takeaway": "", "link": "https://www.leiphone.com/category/private/5YB9zkA19rHTGz0o.html", "source": "雷锋网", "category": "tech_ai", "category_name": /* ================= 状态与工具 ================= */
const PALETTE = ["#3a6dd6","#1f9d8b","#c47a2c","#7a54c8","#c44f86","#4f8a36","#c79125"];
const catColor = {};
function colorFor(id, i){ if(!(id in catColor)) catColor[id]=PALETTE[i%PALETTE.length]; return catColor[id]; }

const state = {
  data: null,
  embedded: DIGEST,
  viewedDate: DIGEST ? DIGEST.date : null,
  activeCat: "all",
  articleId: null,
  navOpen: false,
  availDates: [],
};
let _lastRenderedData = null;

function esc(s){ return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function shiftDate(n){ const d=new Date(); d.setDate(d.getDate()-n); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function fmtDate(s){
  const d=new Date(s+"T00:00:00"); if(isNaN(d)) return s;
  const wd=["周日","周一","周二","周三","周四","周五","周六"][d.getDay()];
  return `${d.getMonth()+1}月${d.getDate()}日 ${wd}`;
}
function fmtTime(iso){
  if(!iso) return "";
  const d=new Date(iso); if(isNaN(d)) return "";
  return `${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}
function isToday(s){ return s===todayStr() || (state.embedded && s===state.embedded.date); }
function currentCats(){ return (state.data||state.embedded||{}).categories||[]; }

/* ================= 数据加载 ================= */
async function loadDate(dateStr){
  state.viewedDate = dateStr;
  state.articleId = null;
  if(state.embedded && dateStr===state.embedded.date){ state.data=state.embedded; render(); return; }
  try{
    const r=await fetch(`archive/${dateStr}.json`,{cache:"no-store"});
    if(r.ok){ state.data=await r.json(); render(); return; }
  }catch(e){ /* 走下方空态 */ }
  state.data={date:dateStr,total:0,categories:state.embedded?state.embedded.categories:[],items:[]};
  render();
}

/* ================= 列表渲染 ================= */
function renderEmpty(title,msg){
  document.getElementById("emptyTitle").textContent=title;
  document.getElementById("emptyMsg").textContent=msg;
  document.getElementById("empty").hidden=false;
  document.getElementById("list").innerHTML="";
}
function render(){
  const D=state.data;
  const list=document.getElementById("list");
  const empty=document.getElementById("empty");
  const detail=document.getElementById("detail");

  if(state.articleId){ renderDetail(state.articleId); return; }
  detail.hidden=true; list.hidden=false;

  if(!D){ renderEmpty("无数据","请先运行生成，或访问最新 data/latest.html。"); return; }
  const cats=D.categories||[];
  const withContent=cats.filter(c=>c.count>0).length;
  document.getElementById("dateLabel").textContent = isToday(D.date) ? "今天" : fmtDate(D.date);

  let head = `<div class="dayhead"><span class="d">${esc(isToday(D.date)?"今日资讯":fmtDate(D.date))}</span>`+
             `<span class="m">共 ${D.total} 条 · ${withContent} 个领域有内容${D.items[0]&&D.items[0].ai?" · AI 摘要":""}</span></div>`;
  let items=(D.items||[]);
  if(state.activeCat!=="all") items=items.filter(it=>it.category===state.activeCat);

  if(items.length===0){
    renderEmpty(state.activeCat!=="all" ? "该分类暂无内容" : "该日暂无内容",
                state.activeCat!=="all" ? "切换其他分类或选择「全部」看看。" : "这一天的归档里没有符合条件的条目。");
    list.innerHTML = head; return;
  }
  empty.hidden=true;
  let html = head;
  items.forEach((it)=>{
    const ci=cats.findIndex(c=>c.id===it.category);
    const col=colorFor(it.category, ci<0?0:ci);
    const pts=(it.points||[]).map(p=>`<li>${esc(p)}</li>`).join("");
    const body = pts ? `<ul class="pts">${pts}</ul>`
                     : (it.summary?`<div class="summary">${esc(it.summary)}</div>`:"");
    const take = it.takeaway ? `<div class="take"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.2 1 2V18h6v-1.3c0-.8.4-1.5 1-2A7 7 0 0 0 12 2Z"/></svg><span>${esc(it.takeaway)}</span></div>` : "";
    // 数据传递：卡片只携带稳定 id；点击后 openArticle(id) 从当前数据源按 id 取完整对象
    html += `<div class="card" role="button" tabindex="0" data-id="${esc(it.id)}" aria-label="阅读：${esc(it.title)}">
      <div class="badges">
        <span class="badge" style="background:${col}1f;color:${col}">${esc(it.category_name)}</span>
        <span class="src">${esc(it.source||"")}</span>
        <span class="score">质量 ${it.score??""}</span>
      </div>
      <div class="row">
        <h2>${esc(it.title)}</h2>
        ${it.link?`<a class="extlink" href="${esc(it.link)}" target="_blank" rel="noopener" title="在原文网站打开" onclick="event.stopPropagation()"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg></a>`:""}
      </div>
      ${body}
      ${take}
    </div>`;
  });
  list.innerHTML = html;
  if(D !== _lastRenderedData){
    _lastRenderedData = D;
    list.querySelectorAll(".card").forEach((c,i)=>{ c.style.animation=`cardin .3s cubic-bezier(.2,.7,.2,1) ${Math.min(i*18,260)}ms both`; });
  }
  list.querySelectorAll(".card").forEach(c=>{
    c.onclick=()=>openArticle(c.dataset.id);
    c.onkeydown=(e)=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); openArticle(c.dataset.id); } };
  });
  renderNav();
}

/* ================= 详情渲染 ================= */
function renderDetail(id){
  const D=state.data;
  const list=document.getElementById("list");
  const empty=document.getElementById("empty");
  const detail=document.getElementById("detail");
  list.hidden=true; empty.hidden=true; detail.hidden=false;

  const it=(D&&D.items||[]).find(x=>x.id===id);
  if(!it){
    detail.innerHTML = `<button class="dback" onclick="location.hash='#/'">← 返回列表</button>
      <div class="empty"><div class="big">内容不存在或已过期</div>
      <p>这条新闻不在当前日期的数据里，可能已被更新替换。返回列表看看其他内容。</p></div>`;
    renderNav();
    return;
  }
  const cats=currentCats();
  const ci=cats.findIndex(c=>c.id===it.category);
  const col=colorFor(it.category, ci<0?0:ci);
  const content=(it.content||"").trim();
  const paras = content
    ? content.split(/\n{1,2}/).map(p=>p.trim()).filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join("")
    : `<p class="note">该条暂无可展示的正文内容，可点击下方「阅读原文」在原文网站查看。</p>`;
  const pts=(it.points||[]).length
    ? `<div class="dpts"><h3>要点速览</h3><ul class="pts">${(it.points||[]).map(p=>`<li>${esc(p)}</li>`).join("")}</ul></div>`
    : "";
  const take=it.takeaway ? `<div class="take"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.2 1 2V18h6v-1.3c0-.8.4-1.5 1-2A7 7 0 0 0 12 2Z"/></svg><span>${esc(it.takeaway)}</span></div>` : "";
  detail.innerHTML = `
    <button class="dback" id="dBack">← 返回列表</button>
    <div class="dhead">
      <div class="dmeta">
        <span class="badge" style="background:${col}1f;color:${col}">${esc(it.category_name)}</span>
        <span>${esc(it.source||"未知来源")}</span>
        ${it.published?`<span>${fmtTime(it.published)}</span>`:""}
        <span>质量 ${it.score??""}</span>
      </div>
      <h1>${esc(it.title)}</h1>
      ${take}
    </div>
    <div class="dbody">${paras}</div>
    ${pts}
    ${it.link?`<a class="readmore" href="${esc(it.link)}" target="_blank" rel="noopener">阅读原文 <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg></a>`:""}`;
  document.getElementById("dBack").onclick=()=>{ location.hash="#/"; };
  window.scrollTo({top:0});
  renderNav();
}

/* ================= 列表 <-> 详情 路由 ================= */
function openArticle(id){ location.hash = "#/item/"+encodeURIComponent(id); }
function route(){
  const h=location.hash||"#/";
  const m=h.match(/^#\/item\/(.+)$/);
  if(m){ state.articleId=decodeURIComponent(m[1]); render(); }
  else{ state.articleId=null; render(); }
}
window.addEventListener("hashchange",route);

/* ================= 底部导航：单胶囊切换器 + 抽屉 ================= */
function renderNav(){
  const bar=document.getElementById("navbarBar"); bar.innerHTML="";
  const cats=currentCats();
  const cur=cats.find(c=>c.id===state.activeCat);
  const ci=cats.indexOf(cur);

  const btn=document.createElement("button");
  btn.className="navbtn"+(state.navOpen?" open":"");
  btn.id="navBtn";
  btn.setAttribute("aria-expanded", state.navOpen?"true":"false");
  // 选中「全部」显示列表图标 + "全部"；选中具体分类显示配色圆点 + 分类名
  const mark = cur
    ? `<span class="dotc" style="background:${colorFor(cur.id, ci<0?0:ci)}"></span>`
    : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6a7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M7 8h10M7 12h10M7 16h6"/></svg>`;
  btn.innerHTML=`${mark}<span class="lab">${cur?esc(cur.name):"全部"}</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>`;
  btn.onclick=()=>toggleNav();
  bar.appendChild(btn);

  renderCatSheet();
}
function renderCatSheet(){
  const sheet=document.getElementById("catSheet");
  const cats=currentCats();
  // 重建抽屉内容：grab handle + 标题 + 副标题 + 网格
  sheet.innerHTML="";
  // grab handle 改为 button + addEventListener + stopPropagation，避免误触拦截
  const grab=document.createElement("button");
  grab.type="button"; grab.className="grab"; grab.setAttribute("aria-label","关闭");
  grab.addEventListener("click",(e)=>{ e.stopPropagation(); toggleNav(false); });
  const h3=document.createElement("h3"); h3.textContent="按领域筛选";
  const sub=document.createElement("p"); sub.className="sub"; sub.textContent="选择一个领域只看该类资讯（共 "+cats.length+" 个领域）";
  const grid=document.createElement("div"); grid.className="cat-grid";
  sheet.append(grab, h3, sub, grid);

  const mkTile=(id, name, col, cnt, isAll)=>{
    const b=document.createElement("button");
    b.type="button";
    b.className="cat-tile"+(state.activeCat===id?" on":"");
    b.dataset.cat=id;
    const mark = isAll
      ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9aa3b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M7 8h10M7 12h10M7 16h6"/></svg>`
      : `<span class="dotc" style="background:${col}"></span>`;
    b.innerHTML=`${mark}<span class="nm">${esc(name)}</span>${cnt!=null?`<span class="cnt">${cnt}</span>`:""}
      <svg class="chk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>`;
    // 用 addEventListener（更稳健；DOM 重建时不会被覆盖）
    b.addEventListener("click",(e)=>onCatTileClick(id,e));
    grid.appendChild(b);
  };
  mkTile("all","全部","#9aa3b0",null,true);
  cats.forEach((c,i)=>mkTile(c.id, c.name, colorFor(c.id,i), c.count));
}
function setCat(key){ state.activeCat=key; render(); }
function onCatTileClick(id, ev){ if(ev) ev.stopPropagation(); setCat(id); toggleNav(false); }
function toggleNav(force){
  const open= force===undefined ? !state.navOpen : force;
  state.navOpen=open;
  document.getElementById("navBtn")?.classList.toggle("open", open);
  document.getElementById("navBtn")?.setAttribute("aria-expanded", open?"true":"false");
  if(open) openSheet("cat"); else closeSheet("cat");
}
document.getElementById("catMask").addEventListener("click",()=>toggleNav(false));

/* ================= 抽屉通用 ================= */
function openSheet(which){
  document.getElementById(which+"Mask").classList.add("show");
  document.getElementById(which+"Sheet").classList.add("show");
  // 锁住背景滚动，避免抽屉打开时背后内容被滑动穿透
  document.body.style.overflow="hidden";
}
function closeSheet(which){
  document.getElementById(which+"Mask").classList.remove("show");
  document.getElementById(which+"Sheet").classList.remove("show");
  if(which==="cat"){ state.navOpen=false; document.getElementById("navBtn")?.classList.remove("open"); document.getElementById("navBtn")?.setAttribute("aria-expanded","false"); }
  // 还原 body 滚动（仅当所有抽屉都已关闭时）
  const anyOpen=document.querySelector(".sheet-mask.show");
  if(!anyOpen) document.body.style.overflow="";
}

/* ================= 日期抽屉 ================= */
function openDateSheet(){
  const inp=document.getElementById("dateInput");
  inp.max = state.embedded? state.embedded.date : todayStr();
  inp.min = state.availDates.length? state.availDates[0] : shiftDate(30);
  inp.value = state.viewedDate || (state.embedded?state.embedded.date:todayStr());
  document.querySelectorAll("#dateQuick .qbtn").forEach(b=>{
    const d=b.dataset.d; const val=d==="today"?todayStr():(d==="yesterday"?shiftDate(1):"");
    b.classList.toggle("on", val && val===inp.value);
  });
  openSheet("date");
}
document.getElementById("datePill").onclick=openDateSheet;
document.getElementById("dateQuick").addEventListener("click",e=>{
  const b=e.target.closest(".qbtn"); if(!b) return;
  const d=b.dataset.d; const val=d==="today"?todayStr():(d==="yesterday"?shiftDate(1):"");
  if(val){ document.getElementById("dateInput").value=val;
    document.querySelectorAll("#dateQuick .qbtn").forEach(x=>x.classList.toggle("on",x===b)); }
});
document.getElementById("dateGo").onclick=()=>{
  const v=document.getElementById("dateInput").value; if(!v) return;
  closeSheet("date"); loadDate(v);
};
document.getElementById("dateMask").onclick=()=>closeSheet("date");

/* ================= 刷新 ================= */
document.getElementById("refreshBtn").onclick=()=>{
  if(state.embedded && state.viewedDate===state.embedded.date){ location.reload(); }
  else { loadDate(state.embedded?state.embedded.date:state.viewedDate); }
};

/* ================= 启动 ================= */
async function boot(){
  if(DIGEST){ state.data=DIGEST; render(); }
  try{
    const r=await fetch("archive/index.json",{cache:"no-store"});
    if(r.ok){ state.availDates=await r.json(); }
  }catch(e){}
  if(!DIGEST){
    try{
      const r=await fetch("../data/latest.json",{cache:"no-store"});
      if(r.ok){ state.embedded=state.data=await r.json(); render(); route(); return; }
    }catch(e){}
    renderEmpty("无数据","请先运行生成，或访问最新 data/latest.html。");
  }
  route();
}
boot();
</script>
</body>
