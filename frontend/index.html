<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#3a6dd6" />
<title>NewsPulse 每日资讯</title>
<style>
  :root{
    /* 间距尺度（4px 基） */
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px;
    --bg:#f3f5f8; --card:#ffffff; --ink:#171a20; --sub:#6a7280; --sub-2:#9aa3b0;
    --line:#e7ebf1; --primary:#3a6dd6; --primary-soft:#eaf1fc; --primary-press:#dde8fa;
    --red:#d9534f; --safe:env(safe-area-inset-bottom);
    --shadow:0 1px 3px rgba(18,28,48,.06), 0 6px 18px rgba(18,28,48,.04);
    --shadow-up:0 -1px 3px rgba(18,28,48,.06), 0 -8px 24px rgba(18,28,48,.05);
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;
    padding-bottom:calc(72px + var(--safe)); /* 给底部导航留位 */
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto;padding:0 var(--s4)}
  button{font-family:inherit}

  /* —— 顶部细栏 —— */
  header.top{
    position:sticky;top:0;z-index:20;background:rgba(243,245,248,.86);
    backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);
    border-bottom:1px solid var(--line);
    padding-top:calc(env(safe-area-inset-top) + 2px);
  }
  .topbar-inner{display:flex;align-items:center;justify-content:space-between;height:52px;gap:var(--s3)}
  .brand{display:flex;align-items:center;gap:var(--s2);min-width:0}
  .brand-mark{width:22px;height:22px;border-radius:7px;background:var(--primary);flex:none;
    position:relative;box-shadow:0 2px 6px rgba(58,109,214,.35)}
  .brand-mark::after{content:"";position:absolute;inset:6px 6px auto auto;width:6px;height:6px;border-radius:2px;background:#fff;opacity:.92}
  .brand-name{font-size:17px;font-weight:800;letter-spacing:.2px;white-space:nowrap}
  .top-actions{display:flex;align-items:center;gap:var(--s2)}
  .datepill{
    display:flex;align-items:center;gap:6px;height:36px;padding:0 12px;border:1px solid var(--line);
    border-radius:999px;background:var(--card);color:var(--ink);font-size:13.5px;font-weight:600;cursor:pointer;
  }
  .datepill:active{background:var(--primary-soft)}
  .datepill .cal{width:15px;height:15px;color:var(--primary);flex:none}
  .iconbtn{
    width:36px;height:36px;border:1px solid var(--line);border-radius:10px;background:var(--card);
    display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;color:var(--primary);
  }
  .iconbtn:active{background:var(--primary-soft)}

  /* —— 列表 —— */
  .list{margin:var(--s4) 0 var(--s2)}
  .dayhead{display:flex;align-items:baseline;gap:var(--s2);margin:var(--s4) 2px var(--s2)}
  .dayhead .d{font-size:15px;font-weight:700;color:var(--ink)}
  .dayhead .m{font-size:12.5px;color:var(--sub)}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:var(--s4);margin:var(--s3) 0;box-shadow:var(--shadow);cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .card:hover{border-color:#d6deea}
  .card:active{transform:translateY(1px);box-shadow:0 1px 2px rgba(18,28,48,.08)}
  .card:focus-visible{outline:2px solid var(--primary);outline-offset:1px}
  .card .badges{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap;margin-bottom:var(--s2)}
  .badge{font-size:12px;padding:3px 9px;border-radius:999px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
  .src{font-size:12px;color:var(--sub)}
  .score{font-size:12px;color:var(--sub);margin-left:auto;font-variant-numeric:tabular-nums}
  .card h2{font-size:17px;margin:2px 0 var(--s2);font-weight:700;line-height:1.42;letter-spacing:-.01em;color:var(--ink)}
  .card .row{display:flex;align-items:center;gap:var(--s2)}
  .extlink{
    width:26px;height:26px;flex:none;border-radius:8px;display:flex;align-items:center;justify-content:center;
    color:var(--sub);background:var(--bg);border:1px solid var(--line);
  }
  .extlink:active{background:var(--primary-soft);color:var(--primary)}
  ul.pts{margin:var(--s2) 0 0;padding-left:18px;color:#3a4150;font-size:14.5px;line-height:1.6}
  ul.pts li{margin:4px 0}
  .summary{margin-top:var(--s2);font-size:14.5px;color:#3a4150;line-height:1.62}
  .take{
    margin-top:var(--s3);font-size:13.5px;color:#2b59b8;background:var(--primary-soft);
    padding:var(--s2) 12px;border-radius:10px;display:flex;gap:7px;align-items:flex-start;line-height:1.55;
  }
  .take svg{width:16px;height:16px;flex:none;margin-top:1px;color:var(--primary)}
  .empty{text-align:center;color:var(--sub);padding:64px var(--s5)}
  .empty .big{font-size:17px;font-weight:700;color:var(--ink);margin-bottom:var(--s2)}
  .empty code{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:13px}
  footer{text-align:center;color:var(--sub-2);font-size:12px;padding:var(--s4) 0 calc(var(--s4) + 4px)}

  /* —— 详情页 —— */
  .detail{animation:pagein .26s cubic-bezier(.2,.7,.2,1)}
  .dback{
    display:inline-flex;align-items:center;gap:6px;margin:var(--s4) 0 var(--s3);padding:8px 14px;
    border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);
    font-size:14px;font-weight:600;cursor:pointer;
  }
  .dback:active{background:var(--primary-soft)}
  .dhead{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:var(--s5) var(--s4);box-shadow:var(--shadow)}
  .dhead .dmeta{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;margin-bottom:var(--s3);font-size:13px;color:var(--sub)}
  .dhead h1{font-size:21px;line-height:1.4;margin:0 0 var(--s3);font-weight:800;letter-spacing:-.01em}
  .dbody{
    margin-top:var(--s3);background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:var(--s4);box-shadow:var(--shadow);font-size:15.5px;line-height:1.78;color:#232833;
  }
  .dbody p{margin:0 0 12px}
  .dbody p:last-child{margin-bottom:0}
  .dbody .note{color:var(--sub);font-size:13.5px}
  .dhead .take{margin-top:0}
  .dpts{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:var(--s4) var(--s4) var(--s4) var(--s5);margin-top:var(--s3);box-shadow:var(--shadow)}
  .dpts h3{margin:0 0 var(--s2);font-size:15px;font-weight:800}
  .readmore{
    display:flex;align-items:center;justify-content:center;gap:8px;margin:var(--s4) 0 var(--s3);
    width:100%;height:48px;border:none;border-radius:12px;background:var(--primary);color:#fff;
    font-size:15.5px;font-weight:700;text-decoration:none;cursor:pointer;
  }
  .readmore:active{filter:brightness(.95)}

  /* —— 底部导航：单胶囊（当前分类切换器） —— */
  /* 借鉴 Material Bottom Navigation / iOS HIG：底栏单按钮 + 抽屉展开全部分类，
     避免多胶囊被压缩导致文字截断；抽屉采用标准 Modal Bottom Sheet。 */
  nav.navbar{
    position:fixed;left:0;right:0;bottom:0;z-index:35;
    background:rgba(255,255,255,.94);backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);
    border-top:1px solid var(--line);
    padding:8px 12px calc(8px + var(--safe));
  }
  .navbar-bar{display:flex;align-items:center;gap:8px}
  .navbtn{
    flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:999px;
    cursor:pointer;display:flex;align-items:center;gap:8px;height:42px;padding:0 14px;
    color:var(--ink);font-size:14px;font-weight:600;
    transition:background .15s,border-color .15s;
  }
  .navbtn:active{background:var(--primary-soft)}
  .navbtn .dotc{width:9px;height:9px;border-radius:50%;flex:none}
  .navbtn .lab{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
  .navbtn .chev{width:16px;height:16px;color:var(--sub);flex:none;transition:transform .22s cubic-bezier(.2,.8,.2,1)}
  .navbtn.open{border-color:var(--primary);color:var(--primary)}
  .navbtn.open .chev{transform:rotate(180deg);color:var(--primary)}

  /* —— 抽屉（标准 Modal Bottom Sheet：圆角顶部 + grab handle + 阴影 + 滑入） —— */
  /* 收起态默认不可点击，避免 hit-test 干扰背后内容 */
  .sheet-mask{position:fixed;inset:0;background:rgba(15,23,42,.42);z-index:40;opacity:0;pointer-events:none;transition:opacity .22s}
  .sheet-mask.show{opacity:1;pointer-events:auto}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--card);
    border-radius:18px 18px 0 0;
    padding:8px var(--s4) calc(var(--s5) + var(--safe));
    transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
    max-height:82vh;overflow:auto;box-shadow:var(--shadow-up);
    pointer-events:none;
  }
  .sheet.show{transform:translateY(0);pointer-events:auto}
  .grab{width:38px;height:4px;border-radius:999px;background:var(--line);margin:6px auto var(--s3);cursor:pointer}
  .sheet h3{margin:0 0 4px;font-size:17px;font-weight:800}
  .sheet .sub{color:var(--sub);font-size:13px;margin:0 0 var(--s3)}

  /* 分类抽屉：网格 */
  .cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s2);margin-top:var(--s1)}
  .cat-tile{
    display:flex;align-items:center;gap:10px;
    padding:13px 12px;border:1px solid var(--line);border-radius:12px;
    background:var(--bg);color:var(--ink);font-size:14.5px;font-weight:600;
    cursor:pointer;text-align:left;transition:background .15s,border-color .15s,color .15s;
    min-width:0;
  }
  .cat-tile:active{background:var(--primary-press)}
  .cat-tile.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
  .cat-tile .dotc{width:10px;height:10px;border-radius:50%;flex:none}
  .cat-tile .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cat-tile .cnt{font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums;flex:none}
  .cat-tile.on .cnt{color:var(--primary)}
  .cat-tile .chk{width:18px;height:18px;color:var(--primary);flex:none;opacity:0;transition:opacity .15s}
  .cat-tile.on .chk{opacity:1}

  /* —— 日期抽屉：快捷按钮 —— */
  .quick{display:flex;gap:var(--s2);flex-wrap:wrap;margin-bottom:var(--s3)}
  .qbtn{padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--bg);
    font-size:14px;font-weight:600;color:var(--ink);cursor:pointer}
  .qbtn:active{background:var(--primary-soft)}
  .qbtn.on{background:var(--primary);color:#fff;border-color:var(--primary)}
  .dateinput{
    width:100%;height:46px;border:1px solid var(--line);border-radius:12px;padding:0 12px;
    font-size:16px;color:var(--ink);background:var(--card);outline:none;
  }
  .dateinput:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
  .primary-btn{
    margin-top:var(--s3);width:100%;height:48px;border:none;border-radius:12px;background:var(--primary);
    color:#fff;font-size:15.5px;font-weight:700;cursor:pointer;
  }
  .primary-btn:active{filter:brightness(.95)}

  @keyframes cardin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes pagein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* 桌面端：底栏收束为居中浮条；分类抽屉居中浮出 */
  @media (min-width:860px){
    .wrap{max-width:820px}
    nav.navbar{left:50%;transform:translateX(-50%);right:auto;bottom:calc(18px + var(--safe));
      width:min(480px,92vw);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
    body{padding-bottom:120px}
    /* 桌面端抽屉浮起并居中，圆角四周 */
    .sheet{left:50%;right:auto;transform:translate(-50%,100%);width:min(420px,92vw);
      border-radius:18px;bottom:calc(18px + var(--safe) + 64px)}
    .sheet.show{transform:translate(-50%,0)}
    .cat-grid{grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>
<body>
<header class="top">
  <div class="wrap topbar-inner">
    <div class="brand"><span class="brand-mark"></span><span class="brand-name">NewsPulse</span></div>
    <div class="top-actions">
      <button class="datepill" id="datePill" title="选择日期">
        <svg class="cal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9h18M8 3v3M16 3v3"/></svg>
        <span id="dateLabel">今天</span>
      </button>
      <button class="iconbtn" id="refreshBtn" title="刷新">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="wrap">
  <!-- 列表视图 -->
  <div class="list" id="list"></div>
  <div class="empty" id="empty" hidden>
    <div class="big" id="emptyTitle">暂无数据</div>
    <p id="emptyMsg">该日暂无归档。每日 12:00（北京时间）生成后，可在日期选择中回看往日。</p>
  </div>
  <!-- 详情视图（默认隐藏，点击列表项后展示） -->
  <article id="detail" class="detail" hidden></article>
</main>

<footer>NewsPulse · 多领域 · 有深度 · 每日 12:00 推送</footer>

<!-- 底部导航：单胶囊（当前分类切换器），点开抽屉展开全部分类 -->
<nav class="navbar" id="navbar">
  <div class="navbar-bar" id="navbarBar"></div>
</nav>

<!-- 分类抽屉（标准 Modal Bottom Sheet：grab handle + 圆角顶部 + 遮罩） -->
<div class="sheet-mask" id="catMask"></div>
<div class="sheet" id="catSheet"></div>

<!-- 日期选择抽屉 -->
<div class="sheet-mask" id="dateMask"></div>
<div class="sheet" id="dateSheet">
  <div class="grab"></div>
  <h3>选择日期</h3>
  <p class="sub">回看任意一天的多领域资讯（每日 12:00 后生成）</p>
  <div class="quick" id="dateQuick">
    <button class="qbtn" data-d="today">今天</button>
    <button class="qbtn" data-d="yesterday">昨天</button>
  </div>
  <input class="dateinput" id="dateInput" type="date" />
  <button class="primary-btn" id="dateGo">查看这一天</button>
</div>

<script>
const DIGEST = /*__DIGEST_JSON__*/null;

/* ================= 状态与工具 ================= */
const PALETTE = ["#3a6dd6","#1f9d8b","#c47a2c","#7a54c8","#c44f86","#4f8a36","#c79125"];
const catColor = {};
function colorFor(id, i){ if(!(id in catColor)) catColor[id]=PALETTE[i%PALETTE.length]; return catColor[id]; }

const state = {
  data: null,
  embedded: DIGEST,
  viewedDate: DIGEST ? DIGEST.date : null,
  activeCat: "all",
  articleId: null,
  navOpen: false,
  availDates: [],
};
let _lastRenderedData = null;

function esc(s){ return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function shiftDate(n){ const d=new Date(); d.setDate(d.getDate()-n); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function fmtDate(s){
  const d=new Date(s+"T00:00:00"); if(isNaN(d)) return s;
  const wd=["周日","周一","周二","周三","周四","周五","周六"][d.getDay()];
  return `${d.getMonth()+1}月${d.getDate()}日 ${wd}`;
}
function fmtTime(iso){
  if(!iso) return "";
  const d=new Date(iso); if(isNaN(d)) return "";
  return `${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}
function isToday(s){ return s===todayStr() || (state.embedded && s===state.embedded.date); }
function currentCats(){ return (state.data||state.embedded||{}).categories||[]; }

/* ================= 数据加载 ================= */
async function loadDate(dateStr){
  state.viewedDate = dateStr;
  state.articleId = null;
  if(state.embedded && dateStr===state.embedded.date){ state.data=state.embedded; render(); return; }
  try{
    const r=await fetch(`archive/${dateStr}.json`,{cache:"no-store"});
    if(r.ok){ state.data=await r.json(); render(); return; }
  }catch(e){ /* 走下方空态 */ }
  state.data={date:dateStr,total:0,categories:state.embedded?state.embedded.categories:[],items:[]};
  render();
}

/* ================= 列表渲染 ================= */
function renderEmpty(title,msg){
  document.getElementById("emptyTitle").textContent=title;
  document.getElementById("emptyMsg").textContent=msg;
  document.getElementById("empty").hidden=false;
  document.getElementById("list").innerHTML="";
}
function render(){
  const D=state.data;
  const list=document.getElementById("list");
  const empty=document.getElementById("empty");
  const detail=document.getElementById("detail");

  if(state.articleId){ renderDetail(state.articleId); return; }
  detail.hidden=true; list.hidden=false;

  if(!D){ renderEmpty("无数据","请先运行生成，或访问最新 data/latest.html。"); return; }
  const cats=D.categories||[];
  const withContent=cats.filter(c=>c.count>0).length;
  document.getElementById("dateLabel").textContent = isToday(D.date) ? "今天" : fmtDate(D.date);

  let head = `<div class="dayhead"><span class="d">${esc(isToday(D.date)?"今日资讯":fmtDate(D.date))}</span>`+
             `<span class="m">共 ${D.total} 条 · ${withContent} 个领域有内容${D.items[0]&&D.items[0].ai?" · AI 摘要":""}</span></div>`;
  let items=(D.items||[]);
  if(state.activeCat!=="all") items=items.filter(it=>it.category===state.activeCat);

  if(items.length===0){
    renderEmpty(state.activeCat!=="all" ? "该分类暂无内容" : "该日暂无内容",
                state.activeCat!=="all" ? "切换其他分类或选择「全部」看看。" : "这一天的归档里没有符合条件的条目。");
    list.innerHTML = head; return;
  }
  empty.hidden=true;
  let html = head;
  items.forEach((it)=>{
    const ci=cats.findIndex(c=>c.id===it.category);
    const col=colorFor(it.category, ci<0?0:ci);
    const pts=(it.points||[]).map(p=>`<li>${esc(p)}</li>`).join("");
    const body = pts ? `<ul class="pts">${pts}</ul>`
                     : (it.summary?`<div class="summary">${esc(it.summary)}</div>`:"");
    const take = it.takeaway ? `<div class="take"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.2 1 2V18h6v-1.3c0-.8.4-1.5 1-2A7 7 0 0 0 12 2Z"/></svg><span>${esc(it.takeaway)}</span></div>` : "";
    // 数据传递：卡片只携带稳定 id；点击后 openArticle(id) 从当前数据源按 id 取完整对象
    html += `<div class="card" role="button" tabindex="0" data-id="${esc(it.id)}" aria-label="阅读：${esc(it.title)}">
      <div class="badges">
        <span class="badge" style="background:${col}1f;color:${col}">${esc(it.category_name)}</span>
        <span class="src">${esc(it.source||"")}</span>
        <span class="score">质量 ${it.score??""}</span>
      </div>
      <div class="row">
        <h2>${esc(it.title)}</h2>
        ${it.link?`<a class="extlink" href="${esc(it.link)}" target="_blank" rel="noopener" title="在原文网站打开" onclick="event.stopPropagation()"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg></a>`:""}
      </div>
      ${body}
      ${take}
    </div>`;
  });
  list.innerHTML = html;
  if(D !== _lastRenderedData){
    _lastRenderedData = D;
    list.querySelectorAll(".card").forEach((c,i)=>{ c.style.animation=`cardin .3s cubic-bezier(.2,.7,.2,1) ${Math.min(i*18,260)}ms both`; });
  }
  list.querySelectorAll(".card").forEach(c=>{
    c.onclick=()=>openArticle(c.dataset.id);
    c.onkeydown=(e)=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); openArticle(c.dataset.id); } };
  });
  renderNav();
}

/* ================= 详情渲染 ================= */
function renderDetail(id){
  const D=state.data;
  const list=document.getElementById("list");
  const empty=document.getElementById("empty");
  const detail=document.getElementById("detail");
  list.hidden=true; empty.hidden=true; detail.hidden=false;

  const it=(D&&D.items||[]).find(x=>x.id===id);
  if(!it){
    detail.innerHTML = `<button class="dback" onclick="location.hash='#/'">← 返回列表</button>
      <div class="empty"><div class="big">内容不存在或已过期</div>
      <p>这条新闻不在当前日期的数据里，可能已被更新替换。返回列表看看其他内容。</p></div>`;
    renderNav();
    return;
  }
  const cats=currentCats();
  const ci=cats.findIndex(c=>c.id===it.category);
  const col=colorFor(it.category, ci<0?0:ci);
  const content=(it.content||"").trim();
  const paras = content
    ? content.split(/\n{1,2}/).map(p=>p.trim()).filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join("")
    : `<p class="note">该条暂无可展示的正文内容，可点击下方「阅读原文」在原文网站查看。</p>`;
  const pts=(it.points||[]).length
    ? `<div class="dpts"><h3>要点速览</h3><ul class="pts">${(it.points||[]).map(p=>`<li>${esc(p)}</li>`).join("")}</ul></div>`
    : "";
  const take=it.takeaway ? `<div class="take"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.2 1 2V18h6v-1.3c0-.8.4-1.5 1-2A7 7 0 0 0 12 2Z"/></svg><span>${esc(it.takeaway)}</span></div>` : "";
  detail.innerHTML = `
    <button class="dback" id="dBack">← 返回列表</button>
    <div class="dhead">
      <div class="dmeta">
        <span class="badge" style="background:${col}1f;color:${col}">${esc(it.category_name)}</span>
        <span>${esc(it.source||"未知来源")}</span>
        ${it.published?`<span>${fmtTime(it.published)}</span>`:""}
        <span>质量 ${it.score??""}</span>
      </div>
      <h1>${esc(it.title)}</h1>
      ${take}
    </div>
    <div class="dbody">${paras}</div>
    ${pts}
    ${it.link?`<a class="readmore" href="${esc(it.link)}" target="_blank" rel="noopener">阅读原文 <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg></a>`:""}`;
  document.getElementById("dBack").onclick=()=>{ location.hash="#/"; };
  window.scrollTo({top:0});
  renderNav();
}

/* ================= 列表 <-> 详情 路由 ================= */
function openArticle(id){ location.hash = "#/item/"+encodeURIComponent(id); }
function route(){
  const h=location.hash||"#/";
  const m=h.match(/^#\/item\/(.+)$/);
  if(m){ state.articleId=decodeURIComponent(m[1]); render(); }
  else{ state.articleId=null; render(); }
}
window.addEventListener("hashchange",route);

/* ================= 底部导航：单胶囊切换器 + 抽屉 ================= */
function renderNav(){
  const bar=document.getElementById("navbarBar"); bar.innerHTML="";
  const cats=currentCats();
  const cur=cats.find(c=>c.id===state.activeCat);
  const ci=cats.indexOf(cur);

  const btn=document.createElement("button");
  btn.className="navbtn"+(state.navOpen?" open":"");
  btn.id="navBtn";
  btn.setAttribute("aria-expanded", state.navOpen?"true":"false");
  // 选中「全部」显示列表图标 + "全部"；选中具体分类显示配色圆点 + 分类名
  const mark = cur
    ? `<span class="dotc" style="background:${colorFor(cur.id, ci<0?0:ci)}"></span>`
    : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6a7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M7 8h10M7 12h10M7 16h6"/></svg>`;
  btn.innerHTML=`${mark}<span class="lab">${cur?esc(cur.name):"全部"}</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>`;
  btn.onclick=()=>toggleNav();
  bar.appendChild(btn);

  renderCatSheet();
}
function renderCatSheet(){
  const sheet=document.getElementById("catSheet");
  const cats=currentCats();
  // 重建抽屉内容：grab handle + 标题 + 副标题 + 网格
  sheet.innerHTML="";
  // grab handle 改为 button + addEventListener + stopPropagation，避免误触拦截
  const grab=document.createElement("button");
  grab.type="button"; grab.className="grab"; grab.setAttribute("aria-label","关闭");
  grab.addEventListener("click",(e)=>{ e.stopPropagation(); toggleNav(false); });
  const h3=document.createElement("h3"); h3.textContent="按领域筛选";
  const sub=document.createElement("p"); sub.className="sub"; sub.textContent="选择一个领域只看该类资讯（共 "+cats.length+" 个领域）";
  const grid=document.createElement("div"); grid.className="cat-grid";
  sheet.append(grab, h3, sub, grid);

  const mkTile=(id, name, col, cnt, isAll)=>{
    const b=document.createElement("button");
    b.type="button";
    b.className="cat-tile"+(state.activeCat===id?" on":"");
    b.dataset.cat=id;
    const mark = isAll
      ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9aa3b0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M7 8h10M7 12h10M7 16h6"/></svg>`
      : `<span class="dotc" style="background:${col}"></span>`;
    b.innerHTML=`${mark}<span class="nm">${esc(name)}</span>${cnt!=null?`<span class="cnt">${cnt}</span>`:""}
      <svg class="chk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>`;
    // 用 addEventListener（更稳健；DOM 重建时不会被覆盖）
    b.addEventListener("click",(e)=>onCatTileClick(id,e));
    grid.appendChild(b);
  };
  mkTile("all","全部","#9aa3b0",null,true);
  cats.forEach((c,i)=>mkTile(c.id, c.name, colorFor(c.id,i), c.count));
}
function setCat(key){ state.activeCat=key; render(); }
function onCatTileClick(id, ev){ if(ev) ev.stopPropagation(); setCat(id); toggleNav(false); }
function toggleNav(force){
  const open= force===undefined ? !state.navOpen : force;
  state.navOpen=open;
  document.getElementById("navBtn")?.classList.toggle("open", open);
  document.getElementById("navBtn")?.setAttribute("aria-expanded", open?"true":"false");
  if(open) openSheet("cat"); else closeSheet("cat");
}
document.getElementById("catMask").addEventListener("click",()=>toggleNav(false));

/* ================= 抽屉通用 ================= */
function openSheet(which){
  document.getElementById(which+"Mask").classList.add("show");
  document.getElementById(which+"Sheet").classList.add("show");
  // 锁住背景滚动，避免抽屉打开时背后内容被滑动穿透
  document.body.style.overflow="hidden";
}
function closeSheet(which){
  document.getElementById(which+"Mask").classList.remove("show");
  document.getElementById(which+"Sheet").classList.remove("show");
  if(which==="cat"){ state.navOpen=false; document.getElementById("navBtn")?.classList.remove("open"); document.getElementById("navBtn")?.setAttribute("aria-expanded","false"); }
  // 还原 body 滚动（仅当所有抽屉都已关闭时）
  const anyOpen=document.querySelector(".sheet-mask.show");
  if(!anyOpen) document.body.style.overflow="";
}

/* ================= 日期抽屉 ================= */
function openDateSheet(){
  const inp=document.getElementById("dateInput");
  inp.max = state.embedded? state.embedded.date : todayStr();
  inp.min = state.availDates.length? state.availDates[0] : shiftDate(30);
  inp.value = state.viewedDate || (state.embedded?state.embedded.date:todayStr());
  document.querySelectorAll("#dateQuick .qbtn").forEach(b=>{
    const d=b.dataset.d; const val=d==="today"?todayStr():(d==="yesterday"?shiftDate(1):"");
    b.classList.toggle("on", val && val===inp.value);
  });
  openSheet("date");
}
document.getElementById("datePill").onclick=openDateSheet;
document.getElementById("dateQuick").addEventListener("click",e=>{
  const b=e.target.closest(".qbtn"); if(!b) return;
  const d=b.dataset.d; const val=d==="today"?todayStr():(d==="yesterday"?shiftDate(1):"");
  if(val){ document.getElementById("dateInput").value=val;
    document.querySelectorAll("#dateQuick .qbtn").forEach(x=>x.classList.toggle("on",x===b)); }
});
document.getElementById("dateGo").onclick=()=>{
  const v=document.getElementById("dateInput").value; if(!v) return;
  closeSheet("date"); loadDate(v);
};
document.getElementById("dateMask").onclick=()=>closeSheet("date");

/* ================= 刷新 ================= */
document.getElementById("refreshBtn").onclick=()=>{
  if(state.embedded && state.viewedDate===state.embedded.date){ location.reload(); }
  else { loadDate(state.embedded?state.embedded.date:state.viewedDate); }
};

/* ================= 启动 ================= */
async function boot(){
  if(DIGEST){ state.data=DIGEST; render(); }
  try{
    const r=await fetch("archive/index.json",{cache:"no-store"});
    if(r.ok){ state.availDates=await r.json(); }
  }catch(e){}
  if(!DIGEST){
    try{
      const r=await fetch("../data/latest.json",{cache:"no-store"});
      if(r.ok){ state.embedded=state.data=await r.json(); render(); route(); return; }
    }catch(e){}
    renderEmpty("无数据","请先运行生成，或访问最新 data/latest.html。");
  }
  route();
}
boot();
</script>
</body>
